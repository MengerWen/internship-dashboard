<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日内策略研究路线图 · 思瑞投资</title>
<style>
/* Research Desk tokens are inlined for the sandboxed iframe and standalone download. */
:root {
  color-scheme: light;
  --bg: #f2eee4;
  --surface: #f8f4eb;
  --surface-2: #e9e2d5;
  --surface-3: #15212b;
  --line: #1e2a31;
  --line-soft: #c8c1b4;
  --text: #15212b;
  --muted: #68716f;
  --focus: #d9654f;
  --font-serif: "Libre Baskerville", "Noto Serif SC", "Songti SC", SimSun, serif;
  --font-body: "Microsoft YaHei UI", "PingFang SC", sans-serif;
  --font-mono: "Cascadia Mono", Consolas, monospace;
  --radius: 2px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(90deg, rgb(21 33 43 / .018) 1px, transparent 1px),
    linear-gradient(180deg, rgb(21 33 43 / .014) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--text);
  font: 15px/1.7 var(--font-body);
}

#intraday-roadmap {
  max-width: 1440px;
  margin-inline: auto;
  padding: clamp(16px, 3vw, 40px) clamp(12px, 3vw, 40px) 40px;
}

[hidden] { display: none !important; }
:is(h1, h2, h3, p, ol, ul) { margin: 0; }
:is(h1, h2, h3) { font-family: var(--font-serif); }
:is(button, select, textarea) { font: inherit; color: inherit; }
:is(button, summary) { cursor: pointer; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.mast {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 12px 32px;
  padding: 16px 0;
  border-top: 3px double var(--line);
  border-bottom: 1px solid var(--line);
}

.mast h1 {
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1.3;
}

.mast h1 + p { margin-top: 7px; }
.progress {
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
}

.flow-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 24px;
  margin: 24px 0 10px;
}

.flow-head h2 { font-size: 22px; }
.flow-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  font-size: 13px;
}

.flow-legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.flow-legend span::before {
  content: "";
  width: 21px;
  border-top: 2px solid var(--muted);
}

.flow-legend .optional::before { border-top-style: dashed; }
.flow-help { display: none; margin-bottom: 8px; font-size: 13px; }
.flow-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  background: var(--surface);
  scrollbar-color: var(--muted) var(--surface-2);
}

.flowchart {
  position: relative;
  min-width: 900px;
  height: 574px;
  background: linear-gradient(90deg,
    var(--surface-2) 10.2%,
    var(--line-soft) 10.2% calc(10.2% + 1px),
    var(--surface) calc(10.2% + 1px));
}

.flowchart svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.flow-rule {
  stroke: var(--line-soft);
  vector-effect: non-scaling-stroke;
}

.flow-edge {
  stroke: var(--muted);
  stroke-width: 1.1;
  fill: none;
  vector-effect: non-scaling-stroke;
}

.flow-edge[data-optional] { stroke-dasharray: 4 4; }
.flow-edge[data-related] {
  stroke: var(--focus);
  stroke-width: 2;
}

.flow-rank {
  position: absolute;
  left: 1.1%;
  width: 8.9%;
  font-size: 12px;
  line-height: 1.45;
  transform: translateY(-50%);
}

.flow-rank strong {
  display: block;
  margin-top: 3px;
  font-size: 13px;
}

.flow-node {
  position: absolute;
  z-index: 1;
  width: 11.2%;
  height: 44px;
  transform: translate(-50%, -50%);
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 0 3px;
  line-height: 1.2;
  font-size: 13px;
  white-space: nowrap;
}

.flow-node .code {
  display: block;
  margin-bottom: 2px;
  font-size: 11px;
}

.flow-node[data-optional] { border-style: dashed; }
.flow-node[data-related] { background: var(--surface-2); }
.flow-node:hover { border-color: var(--line); background: var(--surface-2); }
.flow-node[aria-current="true"] {
  border-color: var(--line);
  background: var(--surface-3);
  color: var(--surface);
}

.flow-node:focus-visible { z-index: 2; }

.task-heading {
  margin: 24px 0 8px;
  font-size: 22px;
}

.rail {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 1px;
  margin-bottom: 16px;
  border: 1px solid var(--line);
  background: var(--line-soft);
}

.rail button {
  padding: 9px 12px;
  min-width: 0;
  border: 0;
  background: var(--surface);
  text-align: left;
  line-height: 1.45;
}

.rail small { display: block; font-size: 12px; }
.rail strong { display: block; margin-top: 3px; }

.grid {
  display: grid;
  grid-template-columns: minmax(200px, .8fr) minmax(0, 2.2fr);
  gap: clamp(12px, 2.4vw, 32px);
  align-items: start;
}

.switch, .tools, .links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.switch, .tabs {
  gap: 1px;
  border: 1px solid var(--line);
  background: var(--line-soft);
}

.switch {
  display: inline-flex;
  max-width: 100%;
}

.btn, .linkbtn, .tabs button, .switch button {
  min-height: 36px;
  padding: 6px 11px;
  font-size: 13px;
  background: var(--surface);
}

.btn, .linkbtn {
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

:is(.rail, .tabs, .switch) button { position: relative; border: 0; }
:is(.rail, .tabs, .switch) button:focus-visible { z-index: 1; }
.btn:hover, .linkbtn:hover, .rail button:hover, .tabs button:hover, .switch button:hover {
  background: var(--surface-2);
}

.primary, .rail button[aria-pressed="true"], .switch button[aria-pressed="true"], .tabs button[aria-pressed="true"] {
  background: var(--surface-3);
  color: var(--surface);
}

.primary:hover { background: var(--line); }
.stageintro {
  margin: 10px 0;
  font-size: 13px;
}

.items { border-top: 1px solid var(--line); }
.item {
  display: grid;
  grid-template-columns: 3ch minmax(0, 1fr);
  gap: 10px;
  align-items: baseline;
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
  line-height: 1.45;
}

.item:hover { background: var(--surface-2); }
.item[aria-current="true"] {
  background: var(--surface);
  box-shadow: inset 3px 0 var(--line);
  font-weight: 700;
}

.item small {
  display: block;
  margin-top: 3px;
  font-size: 12px;
  font-weight: 400;
}

.code { font: 12px var(--font-mono); }
.panel {
  min-width: 0;
  padding: 24px;
  border: 1px solid var(--line);
  background: var(--surface);
  scroll-margin-top: 10px;
}

.panel h2 {
  font-size: clamp(23px, 3vw, 32px);
  line-height: 1.3;
  margin-bottom: 8px;
}

.panel h3 {
  font-size: 16px;
  margin: 16px 0 4px;
}

.meta {
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.why, [data-ui="body"] > :is(p, ol), .box p { max-width: 70ch; }
.tabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin: 16px 0 12px;
}

ol { padding-left: 1.65em; }
li + li { margin-top: 6px; }
.box {
  border-block: 1px solid var(--line-soft);
  background: var(--bg);
  padding: 10px 12px 12px;
  margin: 16px 0;
}

.box h3:first-child { margin-top: 0; }
.hint, .feedback, [data-ui="transferInfo"] { font-size: 13px; }
.linkbtn { text-align: left; }
textarea, select {
  border: 1px solid var(--muted);
  border-radius: var(--radius);
  background: var(--bg);
}

textarea {
  display: block;
  width: 100%;
  resize: vertical;
  padding: 8px 10px;
  line-height: 1.55;
}

textarea[readonly] { min-height: 15em; }
textarea::placeholder { color: var(--text); opacity: .8; }
select { min-height: 36px; max-width: 100%; padding-inline: 7px; }
.foot {
  border-top: 1px solid var(--line);
  margin-top: 16px;
  padding-top: 8px;
}

details { margin-top: 12px; }
summary { padding: 4px 0; font-weight: 700; }
details > :not(summary) { margin-top: 8px; }
.sources { overflow-wrap: anywhere; padding-left: 1.4em; }
.feedback:not(:empty) { margin-top: 8px; }
.depflow {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 8px 0 12px;
}

.depflow > div {
  border-top: 1px solid var(--line-soft);
  padding: 0 6px 8px;
}

.depflow .current {
  border-top: 2px solid var(--focus);
  background: var(--surface-2);
}

.depflow + .hint { margin-top: 8px; }
[data-ui="body"] > .hint + .hint { margin-top: 4px; }
.actionrow { margin-block: 8px; }
[data-ui="transfer"] { border-top-color: var(--line-soft); }

@media (max-width: 960px) {
  .flow-help { display: block; }
}

@media (max-width: 820px) {
  .rail { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 620px) {
  .grid, .depflow { grid-template-columns: minmax(0, 1fr); }
  .mast { align-items: start; }
  .flow-head { margin-top: 18px; }
  .rail button { padding-inline: 8px; }
  :is(.btn, .linkbtn, .tabs button, .switch button, select, summary) { min-height: 44px; }
  :is(select, textarea) { font-size: 16px; }
  summary { padding-block: 9px; }
  .panel { padding: 14px; }
  .panel h2 { font-size: 24px; }
}

@media (max-width: 370px) {
  .rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tabs button { padding-inline: 4px; }
}
</style>
</head>
<body>
<main id="intraday-roadmap">
  <header class="mast">
    <div>
      <h1>日内策略研究路线图</h1>
      <p>两亿元账户 · 现金、旧仓与滚动预测 · 思瑞投资</p>
    </div>
    <p class="progress" data-ui="progress" aria-live="polite"></p>
  </header>

  <section aria-labelledby="intraday-flow-title">
    <div class="flow-head">
      <h2 id="intraday-flow-title">研究流程</h2>
      <div class="flow-legend" aria-label="流程图图例">
        <span>必需交接</span>
        <span class="optional">可选纳入综合核验</span>
      </div>
    </div>
    <p class="flow-help" id="intraday-flow-help">横向滚动查看完整流程，点任务查看详情。</p>
    <div class="flow-scroll" role="region" aria-labelledby="intraday-flow-title" aria-describedby="intraday-flow-help" tabindex="0">
      <div class="flowchart" data-ui="overview" role="group" aria-label="六层研究流程图。点任务查看详情"></div>
    </div>
  </section>

  <section aria-labelledby="intraday-task-title">
    <h2 class="task-heading" id="intraday-task-title">研究任务</h2>
    <nav class="rail" data-ui="rail" aria-label="研究层级"></nav>
    <div class="grid">
      <aside aria-label="任务索引">
        <div class="switch" role="group" aria-label="任务范围">
          <button type="button" data-ui="layerMode">本层任务</button>
          <button type="button" data-ui="readyMode">当前可开始</button>
        </div>
        <p class="stageintro" data-ui="intro"></p>
        <div class="items" data-ui="items"></div>
      </aside>

      <section class="panel" data-ui="panel" aria-label="任务详情">
        <div class="meta" data-ui="meta"></div>
        <h2 data-ui="title"></h2>
        <p class="why" data-ui="why"></p>
        <nav class="tabs" data-ui="tabs" aria-label="任务详情内容"></nav>
        <div data-ui="body"></div>
        <div class="foot">
          <details data-ui="record">
            <summary>登记本任务进度与交接结果</summary>
            <p class="hint">填写结果文件路径或版本及一句结论。标为“已交接”后，下游 Prompt 会带上这条记录。</p>
            <label>
              交接记录
              <textarea data-ui="note" rows="2" maxlength="180" placeholder="文件或对象路径、版本，以及适用范围或否定结论"></textarea>
            </label>
            <div class="tools actionrow">
              <label>
                进度
                <select data-ui="status">
                  <option value="todo">待开展</option>
                  <option value="doing">进行中</option>
                  <option value="blocked">受阻</option>
                  <option value="done">已交接</option>
                </select>
              </label>
              <button class="btn" type="button" data-ui="save">保存本项</button>
            </div>
          </details>
          <p class="feedback" data-ui="feedback" role="status"></p>
        </div>
      </section>
    </div>
  </section>

  <details class="foot" data-ui="transfer">
    <summary>跨设备或视图转移进度</summary>
    <p class="hint">进度由你登记。复制当前记录可备份；在另一个视图粘贴并合并，只有输入中列出的任务会更新。此处只放交接位置和结论。</p>
    <textarea rows="3" data-ui="transferText" aria-label="路线图进度 JSON"></textarea>
    <div class="tools actionrow">
      <button class="btn" type="button" data-ui="exportState">生成当前记录</button>
      <button class="btn" type="button" data-ui="importState">合并粘贴的记录</button>
    </div>
    <p data-ui="transferInfo" role="status"></p>
  </details>
</main>
<script>
(() => {
  "use strict";
  const root = document.getElementById("intraday-roadmap");
  const plan = {
  "levels": [
    [
      "并行起步",
      "先开资料核对与因子调研。其余会话可同时准备，需占用服务器的任务共用资源排期。"
    ],
    [
      "准备可用输入",
      "把库存、成本、分数和因子候选整理成能被其他会话直接使用的输入。各项只等自己所列的前置结果。"
    ],
    [
      "分项回放",
      "先分别回答现金与持仓能否恢复、滚动决策是否增加机会、新因子是否带来增量。"
    ],
    [
      "组合与旁支",
      "在同一账户内测交互。主动隔夜和新因子接入各有独立入口，分别记录收益来源。"
    ],
    [
      "统一核验",
      "集中复核多条研究线的结果，保留负结果、无法识别的问题和剩余风险。"
    ],
    [
      "统一汇报",
      "证据积累到足以比较取舍后，再整理一次面向研究负责人的汇报稿。"
    ]
  ],
  "refs": {
    "meet": "会议逐字稿｜项目资料中的 11 月 17 日会议逐字稿",
    "acct": "底仓与净值｜decisions/2026-11-11-base-position.md",
    "fill": "成交规则｜decisions/2026-11-11-fill-rules.md",
    "model": "冻结模型与评价合同｜decisions/2026-11-16-factor-evaluation-and-model-versions.md",
    "base": "现有账簿与复用入口｜reports/2026-11/2026-11-16-csi2000-baseline-implementation.md",
    "cat": "已有候选族与字段｜research/factor-candidates/README.md",
    "ideas": "已有高频候选｜reports/2026-11/2026-11-16-high-frequency-factor-research.md",
    "ext": "沪市扩因子比较｜reports/2026-11/2026-11-17-sse-factor-extension.md",
    "pilot": "沪市深档样本｜reports/2026-11/2026-11-17-sse-high-frequency-depth-pilot.md",
    "horiz": "旧深市持有期｜reports/2026-10/2026-10-29-signal-horizon-decay.md",
    "night": "旧深市隔夜分段｜reports/2026-10/2026-10-30-signal-overnight-hold.md",
    "fee": "现有税费与交易收益口径｜reports/2026-11/2026-11-16-csi2000-fees-and-trading-returns.md"
  },
  "tasks": [
    {
      "id": "R01",
      "level": 1,
      "title": "冻结输入与评价口径",
      "track": "研究口径",
      "effort": "资料与设计",
      "need": [],
      "side": [],
      "ref": [
        "meet",
        "model",
        "acct",
        "fill",
        "base"
      ],
      "why": "让不同会话比较同一份本金、同一交易日、同一版分数，避免把账户口径变化算成策略收益。",
      "steps": [
        "定位冻结的沪深预测、点时成分与权重、交易日历、现金与库存规则、现有成本及成交入口。逐项注明版本、覆盖、缺口和真实读取位置。",
        "以两亿元总本金比较股现配比，50/50 是锚点。长期现金比例与当天可动用预算分开；旧每股比例实验退出本轮。登记逐股恢复、恢复总比例、总比例与主动权重都有约束三种收盘目标。",

      "branch": "缺失的字段标注可支持的市场与期限，明确哪些比较需补数。"

    {
      "id": "R02",
      "level": 1,
      "title": "三种成交情景",

    {
      "id": "R03",
      "level": 1,

      "effort": "已有数据分析",
      "need": [],

      "ref": [

      ],
      "why": "同样选前 5%，每一天和每种底仓下可卖旧仓的金额都可能不同。",

      if (phases[t.id]) {
        const detail=el("details");detail.append(el("summary","分阶段交接 · "+phases[t.id].length+" 个检查点"));
        const ol=el("ol");phases[t.id].forEach(([name,,,receipt])=>ol.append(el("li",name+"。"+receipt)));detail.append(ol);panel.append(detail);
      }
      if (t.ref.length) {
        const details=el("details");details.append(el("summary","原始资料入口"));const list=el("ul",undefined,"sources");
        t.ref.forEach(r=>{const s=source(r);list.append(el("li",s.name+" · "+s.path));});details.append(list);panel.append(details);
      }
    }
  }
  function flowY(level) { return 36 + (level - 1) * 100; }
  function svgNode(tag, attrs) {
    const n = document.createElementNS("http://www.w3.org/2000/svg",tag);
    for (const [key,value] of Object.entries(attrs)) n.setAttribute(key,String(value));
    return n;
  }
  function edgePosition(edge, peers, endpoint) {
    const other = endpoint === "from" ? "to" : "from";
    peers.sort((a,b) => flowNodes[a[other]][0] - flowNodes[b[other]][0]);
    return flowNodes[edge[endpoint]][0] + 10 * (peers.indexOf(edge) - (peers.length - 1) / 2);
  }
  function flowPath(points) {
    const vertices = points.filter(([x,y],i) => i === 0 || x !== points[i-1][0] || y !== points[i-1][1]);
    const toward = (a,b,r) => a.map((v,i) => v + Math.sign(b[i] - v) * r);
    const distance = (a,b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
    let d = "M" + vertices[0].join(" ");
    for (let i=1;i<vertices.length-1;i++) {
      const prev = vertices[i-1], corner = vertices[i], next = vertices[i+1];
      const radius = Math.min(6,distance(prev,corner)/2,distance(corner,next)/2);
      d += " L" + toward(corner,prev,radius).join(" ") + " Q" + corner.join(" ") + " " + toward(corner,next,radius).join(" ");
    }
    return d + " L" + vertices.at(-1).join(" ");
  }
  function renderFlowchart() {
    const overview = ui.overview;
    overview.replaceChildren();
    const edges = tasks.flatMap(t => t.need.map(from => ({from,to:t.id,optional:false})));
    edges.push(...byId.get("R18").side.map(from => ({from,to:"R18",optional:true})));
    const bendsByLevel = new Map(levels.slice(0,-1).map((_,i) => [i+1,[]]));
    for (const edge of edges) {
      edge.source = byId.get(edge.from).level;
      edge.target = byId.get(edge.to).level;
      edge.start = edgePosition(edge,edges.filter(e=>e.from===edge.from),"from");
      edge.end = edgePosition(edge,edges.filter(e=>e.to===edge.to),"to");
      const via = throughX[edge.from+"-"+edge.to];
      edge.bends = via === undefined
        ? [{level:edge.source,from:edge.start,to:edge.end}]
        : [{level:edge.source,from:edge.start,to:via},{level:edge.target-1,from:via,to:edge.end}];
      for (const bend of edge.bends) bendsByLevel.get(bend.level).push(bend);
    }
    for (const [level,bends] of bendsByLevel) {
      bends.sort((a,b) => (a.from+a.to) - (b.from+b.to));
      bends.forEach((bend,i) => { bend.y = flowY(level) + 28 + (i+1)*44/(bends.length+1); });
    }
    const svg = svgNode("svg",{viewBox:"0 0 "+flowWidth+" "+flowHeight,preserveAspectRatio:"none","aria-hidden":"true"});
    const defs = svgNode("defs",{});
    for (const [id,fill] of [["intraday-arrow","var(--muted)"],["intraday-active-arrow","var(--focus)"]]) {
      const marker = svgNode("marker",{id,viewBox:"0 0 8 8",refX:7,refY:4,markerWidth:6,markerHeight:6,orient:"auto"});
      marker.append(svgNode("path",{d:"M0 0 L8 4 L0 8 Z",fill}));
      defs.append(marker);
    }
    svg.append(defs);
    for (let i=1;i<levels.length;i++) {
      const y = flowY(i) + 50;
      svg.append(svgNode("line",{x1:11,x2:89,y1:y,y2:y,class:"flow-rule"}));
    }
    const related = new Set();
    const activeEdges = [];
    for (const edge of edges) {
      const points = [[edge.start,flowY(edge.source)+nodeHalfHeight]];
      for (const bend of edge.bends) points.push([bend.from,bend.y],[bend.to,bend.y]);
      points.push([edge.end,flowY(edge.target)-nodeHalfHeight-2]);
      const active = edge.from === selected || edge.to === selected;
      const path = svgNode("path",{d:flowPath(points),class:"flow-edge",
        "data-from":edge.from,"data-to":edge.to,"marker-end":active?"url(#intraday-active-arrow)":"url(#intraday-arrow)"});
      if (edge.optional) path.setAttribute("data-optional","");
      if (active) {
        related.add(edge.from === selected ? edge.to : edge.from);
        path.setAttribute("data-related","");
        activeEdges.push(path);
      } else {
        svg.append(path);
      }
    }
    svg.append(...activeEdges);
    overview.append(svg);
    levels.forEach(([name],i) => {
      const rank = el("div",undefined,"flow-rank");
      rank.style.top = flowY(i+1)+"px";
      rank.append(el("span","第 "+(i+1)+" 层"),el("strong",name));
      overview.append(rank);
    });
    for (const [id,[x,label]] of Object.entries(flowNodes)) {
      const task = byId.get(id);
      const node = button("",() => {
        openTask(id);
        ui.panel.scrollIntoView?.({block:"start"});
        ui.tabs.firstElementChild.focus();
      },"flow-node");
      node.style.left = 100*x/flowWidth+"%";
      node.style.top = flowY(task.level)+"px";
      node.dataset.task = id;
      node.setAttribute("aria-label",id+" "+task.title);
      if (id === selected) node.setAttribute("aria-current","true");
      if (related.has(id)) node.setAttribute("data-related","");
      if (task.track === "可选旁支") node.setAttribute("data-optional","");
      node.append(el("span",id,"code"),el("span",label));
      overview.append(node);
    }
  }
  function render() {
    const t=byId.get(selected);
    renderFlowchart();
    ui.progress.textContent=tasks.filter(x=>isDone(x.id)).length+" / "+tasks.length+" 已交接 · "+tasks.filter(ready).length+" 项可开始";
    ui.rail.replaceChildren();
    levels.forEach(([name],i)=>{
      const members=tasks.filter(x=>x.level===i+1);
      const b=button("",()=>openTask(members[0].id),"");
      b.append(el("small","第 "+(i+1)+" 层 · "+members.length+" 项"),el("strong",name));
      b.setAttribute("aria-pressed",String(mode==="layer" && level===i+1));ui.rail.append(b);
    });
    ui.layerMode.setAttribute("aria-pressed",String(mode==="layer"));
    ui.readyMode.setAttribute("aria-pressed",String(mode==="ready"));
    ui.intro.textContent=mode==="ready"?"跨层显示前置结果已到齐、尚待开展的任务。":levels[level-1][1];
    ui.items.replaceChildren();
    const list=workList();
    if (!list.length) ui.items.append(el("p","当前没有待启动任务。可回到本层查看进行中或受阻的工作。","hint"));
    for (const item of list) {
      const b=button("",()=>{ selected=item.id;level=item.level;tab="work";ui.record.open=false;render();persist(); },"item");
      b.setAttribute("aria-current",String(item.id===selected));const body=el("span",item.title);
      body.append(el("small",status(item)+" · "+(item.id==="R04"?"ChatGPT":"Codex")));
      b.append(el("span",item.id,"code"),body);ui.items.append(b);
    }
    ui.meta.textContent=t.id+"　/　第 "+t.level+" 层　·　"+t.track+"　·　"+t.effort+"　·　"+status(t);
    ui.title.textContent=t.title;ui.why.textContent=t.why;
    ui.tabs.replaceChildren();for(const [k,v] of Object.entries(tabNames)){
      const b=button(v,()=>{tab=k;render();persist();},"");b.setAttribute("aria-pressed",String(tab===k));ui.tabs.append(b);
    }
    renderDetails(t);
    ui.status.value=record(t.id).status;ui.note.value=record(t.id).note;ui.feedback.textContent="";
  }
  ui.layerMode.addEventListener("click",()=>{mode="layer";render();persist();});
  ui.readyMode.addEventListener("click",()=>{
    mode="ready";const items=workList();
    if(items.length&&!items.some(t=>t.id===selected)){selected=items[0].id;level=items[0].level;tab="work";}
    render();persist();
  });
  ui.save.addEventListener("click",()=>{
    const t=byId.get(selected), state=ui.status.value, note=ui.note.value.trim();
    if(state==="done" && (!note || !t.need.every(isDone))){
      ui.feedback.textContent=!note?"请先填写可核对的交接结果。":"请先登记必需上游的交接结果。";return;
    }
    const prior=record(t.id);
    const affected=new Set();
    if (prior.status==="done" && (state!=="done" || note!==prior.note)) {
      affected.add(t.id);
      for(const child of tasks) {
        if(child.need.some(id=>affected.has(id))){
          affected.add(child.id);
          if(record(child.id).status==="done") records[child.id]={status:"blocked",note:record(child.id).note};
        }
      }
    }
    records[t.id]={status:state,note};mode="layer";render();ui.feedback.textContent=t.id+" 的进度已保存。"+(affected.size>1?"已交接的相关下游需复核。":"");persist();
  });
  ui.exportState.addEventListener("click",()=>{
    ui.transferText.value=JSON.stringify({version:key,records},null,2);ui.transferText.focus();ui.transferText.select();
    ui.transferInfo.textContent="已生成并选中当前交接记录，可复制保存。";
  });
  ui.importState.addEventListener("click",()=>{
    try {
      const input=JSON.parse(ui.transferText.value);
      if(input.version!==key)throw Error("路线图版本不匹配");
      const clean=readRecords(input.records,true);
      const affected=new Set();
      for(const t of tasks) {
        const incoming=clean[t.id], prior=record(t.id);
        if(incoming && prior.status==="done" && (incoming.status!=="done" || incoming.note!==prior.note)) affected.add(t.id);
        if(t.need.some(id=>affected.has(id))) {
          affected.add(t.id);
          if(!incoming && prior.status==="done") records[t.id]={status:"blocked",note:prior.note};
        }
      }
      records={...records,...clean};render();persist();ui.transferInfo.textContent="已合并 "+Object.keys(clean).length+" 项。";
    } catch(err) {ui.transferInfo.textContent="未合并。"+err.message;}
  });
  try { stateFrom(JSON.parse(localStorage.getItem(key)||"null")); } catch {}
  try { stateFrom(window.openai?.widgetState?.privateContent); } catch {}
  if (location.protocol==="file:" && byId.has(location.hash.slice(1))) {
    selected=location.hash.slice(1);level=byId.get(selected).level;mode="layer";
  }
  window.addEventListener("openai:set_globals",event=>{
    try { if(stateFrom(event.detail?.globals?.widgetState?.privateContent)) render(); } catch {}
  });
  render();
})();
</script>
