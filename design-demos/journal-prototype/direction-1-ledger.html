<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向一 · 研究台历｜研究日志原型</title>
<link rel="stylesheet" href="proto.css">
<style>
.wrap { max-width: 1320px; margin: 0 auto; }
.body { display: grid; grid-template-columns: 1fr 352px; gap: 0 28px; padding: 0 24px 90px; align-items: start; }

/* 链条总览 = 筛选器 */
.overview { padding: 0 24px 18px; }
.overview h2 { font-family: var(--font-serif); font-size: 13px; margin: 0 0 10px; font-weight: 400; color: var(--muted); }
.ovgrid { display: grid; grid-template-columns: 104px 1fr; gap: 2px 10px; align-items: center; }
.ovtrack { font-size: 12px; color: var(--muted); text-align: right; }
.ovlane { position: relative; height: 18px; }
.ovbar { position: absolute; top: 6px; height: 5px; background: var(--line); cursor: pointer; transition: background 120ms var(--ease); }
.ovbar.is-on { background: var(--focus); }
.ovbar:hover { background: var(--focus); }
.filterbar { padding: 0 24px 14px; font-size: 12px; color: var(--muted); min-height: 20px; }
.filterbar button { font: inherit; background: none; border: 1px solid var(--line-soft); padding: 2px 8px; cursor: pointer; margin-left: 8px; color: var(--text); }

/* 月历 */
.cal { position: relative; }
.threads { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.monthblock { margin-bottom: 30px; }
.monthhead {
  display: flex; align-items: baseline; gap: 12px;
  font-family: var(--font-serif); font-size: 17px; font-weight: 700;
  border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 0;
}
.monthhead span { font-family: var(--font-body); font-size: 11px; font-weight: 400; color: var(--muted); }
.wdrow { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 10px; color: var(--muted); padding: 5px 0 3px; }
.wdrow div { padding-left: 7px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); }
.cell {
  background: var(--bg); min-height: 104px; padding: 6px 7px 7px; position: relative;
  display: flex; flex-direction: column; gap: 3px; text-align: left;
  border: 0; font: inherit; color: inherit; cursor: default;
  transition: background 120ms var(--ease);
}
.cell.void { background: var(--bg-deep); opacity: 0.45; min-height: 104px; }
.cell.idle { cursor: default; }
.cell.work { cursor: pointer; }
.cell.work:hover { background: var(--surface-2); }
.cell.work:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.cell.rep { background: var(--surface); box-shadow: inset 0 3px 0 0 var(--line); padding-top: 9px; }
.cell.sel { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--focus); }
.cell.dim { opacity: 0.2; }
.dn { font-family: var(--font-serif); font-size: 15px; line-height: 1; }
.dn em { font-style: normal; font-size: 10px; color: var(--muted); margin-left: 4px; font-family: var(--font-body); }
.ch {
  font-size: 11.5px; line-height: 1.38; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.cell.rep .ch { font-family: var(--font-serif); font-size: 11.5px; }
.ch.draft { color: var(--muted); }
.tags { margin-top: auto; display: flex; flex-wrap: wrap; gap: 2px; }
.tag { font-size: 9.5px; border: 1px solid var(--line-soft); padding: 0 3px; color: var(--muted); white-space: nowrap; }
.tag.inferred { border-style: dashed; }
.repmark { position: absolute; top: 7px; right: 7px; font-size: 9.5px; color: var(--focus); }
.cnt { position: absolute; bottom: 6px; right: 7px; font-size: 9.5px; color: var(--muted); }
/* 底部细条 = 当天提交量，窄屏下它是唯一还能看出忙闲的东西 */
.bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--line); opacity: 0.75; }

/* 右侧详情 */
.panel {
  position: sticky; top: 16px; border: 1px solid var(--line); background: var(--surface);
  padding: 16px 16px 20px; font-size: 13px; max-height: calc(100vh - 40px); overflow: auto;
}
.panel .pd { font-family: var(--font-serif); font-size: 20px; margin: 0 0 2px; }
.panel .pw { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.panel h4 { font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: 0.04em; margin: 16px 0 5px; border-bottom: 1px solid var(--line-soft); padding-bottom: 3px; }
.panel ul { margin: 0; padding-left: 17px; }
.panel li { margin-bottom: 3px; }
.panel .flow div { margin-bottom: 3px; }
.panel .arrow { font-family: var(--font-mono); color: var(--muted); margin-right: 5px; }
.panel .kind { font-size: 10px; color: var(--muted); margin-left: 5px; }
.panel details { margin-bottom: 6px; }
.panel summary { cursor: pointer; font-size: 12px; }
.panel table { border-collapse: collapse; width: 100%; font-size: 11.5px; margin-top: 5px; }
.panel td { border-bottom: 1px solid var(--line-soft); padding: 2px 6px 2px 0; vertical-align: top; }
.panel td.sha { font-family: var(--font-mono); font-size: 10.5px; color: var(--blue); white-space: nowrap; }
.panel .pathline { font-size: 10.5px; color: var(--muted); margin: 3px 0 0; }
.panel .plan { font-family: var(--font-mono); font-size: 10.5px; }
.panel .hint { color: var(--muted); }

@media (max-width: 1040px) {
  .body { grid-template-columns: 1fr; }
  .panel { position: static; max-height: none; margin-top: 22px; }
}
@media (max-width: 720px) {
  .grid { grid-template-columns: repeat(7, 1fr); }
  .cell { min-height: 62px; padding: 4px; }
  .ch { display: none; }
  .tags { display: none; }
  .repmark { display: none; }
  .cnt { bottom: 7px; }
  .cell.rep { box-shadow: inset 0 3px 0 0 var(--line); }
  .dn { font-size: 12px; }
  .body { padding: 0 14px 60px; }
  .viewhead h1 { font-size: 23px; }
}
</style>
</head>
<body>
<div class="proto-note">设计原型 · <b>方向一「研究台历」</b>　一天一格，月历读节奏；选一条链，线索在格子之间串起来。数据为本机三仓库 92 天真实提交／PLAN／日报；链条与交接为<b>草案</b>，标「待写」的一句话是自动草拟。</div>

<header class="masthead">
  <div class="masthead-row">
    <div class="edition">Research edition no. 06<br>Shanghai · 2026</div>
    <div class="brand">量化实习成果看板<small>QUANT RESEARCH ARCHIVE</small></div>
    <div class="edition" style="text-align:right">原型 · 不是线上页面</div>
  </div>
  <nav class="tabs">
    <a class="tab" href="#">正式成果</a>
    <a class="tab" href="#">每日汇报</a>
    <a class="tab is-active" href="#">研究日志</a>
  </nav>
</header>

<div class="wrap">
  <div class="viewhead">
    <div><h1>研究日志</h1><p>每天做了什么，接住了什么，交给了谁</p></div>
    <div class="stat" id="stat"></div>
  </div>

  <section class="overview">
    <h2>链条总览　点一条链，台历上只留这条链的日子，并把它们串起来</h2>
    <div class="ovgrid" id="ovgrid"></div>
  </section>
  <div class="filterbar" id="filterbar"></div>
  <div class="legend">
    <i><span style="background:#f8f4eb;box-shadow:inset 0 3px 0 0 #1e2a31;padding:3px 9px">有每日汇报</span></i>
    <i><span style="background:#f2eee4;border:1px solid #c8c1b4;padding:2px 8px">有工作</span></i>
    <i><span style="background:#e5ded0;opacity:.5;padding:2px 8px">无记录</span></i>
    <i><span style="border:1px dashed #c8c1b4;padding:0 4px;font-size:10px">虚线链名 = 推断</span></i>
    <i>右下角数字 = 当天提交数</i>
  </div>

  <div class="body">
    <div class="cal" id="cal"><svg class="threads" id="threads"></svg></div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  const D = window.JOURNAL_DATA;
  const chains = new Map(D.chains.map((c) => [c.id, c]));
  const byDate = new Map(D.days.map((d) => [d.date, d]));
  const REPO_SHORT = { "sirui-quant-research": "研究主仓", "Quant_Research-Trading": "父仓", "internship-dashboard": "看板仓" };

  const active = new Map();
  D.days.forEach((d) => d.chains.forEach((c) => {
    if (!active.has(c)) active.set(c, []);
    active.get(c).push(d.date);
  }));

  document.getElementById("stat").innerHTML =
    "<b>" + D.days.length + "</b> 天有记录　<b>" + D.days.filter((d) => d.report).length + "</b> 天有每日汇报<br>"
    + active.size + " 条链条 · 2026-06-04 → 2026-10-20";

  // 总览
  const ov = document.getElementById("ovgrid");
  const t0 = new Date(D.days[0].date).getTime();
  const t1 = new Date(D.days[D.days.length - 1].date).getTime();
  const pos = (s) => ((new Date(s).getTime() - t0) / (t1 - t0)) * 100;
  D.tracks.forEach((tr) => {
    const a = document.createElement("div"); a.className = "ovtrack"; a.textContent = tr.label;
    const b = document.createElement("div"); b.className = "ovlane";
    D.chains.filter((c) => c.track === tr.id && active.has(c.id)).forEach((c) => {
      const act = active.get(c.id);
      const bar = document.createElement("div");
      bar.className = "ovbar"; bar.dataset.chain = c.id;
      bar.title = c.label + "（" + act[0] + " → " + act.slice(-1)[0] + "，" + act.length + " 天）";
      bar.style.left = pos(act[0]) + "%";
      bar.style.width = Math.max(1.2, pos(act.slice(-1)[0]) - pos(act[0])) + "%";
      b.appendChild(bar);
    });
    ov.appendChild(a); ov.appendChild(b);
  });

  // 月历
  const cal = document.getElementById("cal");
  const months = [...new Set(D.days.map((d) => d.date.slice(0, 7)))];
  const cellOf = new Map();
  months.forEach((m) => {
    const [Y, M] = m.split("-").map(Number);
    const first = new Date(Date.UTC(Y, M - 1, 1));
    const lead = (first.getUTCDay() + 6) % 7;          // 周一为首列
    const dim = new Date(Date.UTC(Y, M, 0)).getUTCDate();
    const n = D.days.filter((d) => d.date.slice(0, 7) === m).length;
    const block = document.createElement("section");
    block.className = "monthblock";
    block.innerHTML = '<div class="monthhead">' + Y + " 年 " + M + " 月<span>" + n + " 天有记录</span></div>"
      + '<div class="wdrow">' + ["一", "二", "三", "四", "五", "六", "日"].map((w) => "<div>" + w + "</div>").join("") + "</div>";
    const grid = document.createElement("div");
    grid.className = "grid";
    for (let i = 0; i < lead; i++) {
      const v = document.createElement("div"); v.className = "cell void"; grid.appendChild(v);
    }
    for (let day = 1; day <= dim; day++) {
      const ds = m + "-" + String(day).padStart(2, "0");
      const rec = byDate.get(ds);
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell " + (rec ? "work" : "idle") + (rec && rec.report ? " rep" : "");
      cell.dataset.date = ds;
      cell.dataset.chains = rec ? rec.chains.join(" ") : "";
      const wd = (new Date(ds + "T00:00:00Z").getUTCDay() + 6) % 7;
      let html = '<span class="dn">' + day + (wd >= 5 ? "<em>休</em>" : "") + "</span>";
      if (rec) {
        const draft = rec.headline_source === "commit" || rec.headline_source === "none";
        html += '<span class="ch' + (draft ? " draft" : "") + '">' + esc(rec.headline) + "</span>";
        html += '<span class="tags">' + (rec.chains.length
          ? rec.chains.map((c) => '<span class="tag ' + (rec.chain_confidence[c] || "") + '">'
              + (chains.get(c) ? chains.get(c).short : c) + "</span>").join("")
          : '<span class="tag inferred">未归类</span>') + "</span>";
        if (rec.report) html += '<span class="repmark">汇报 ↗</span>';
        if (rec.total_commits) {
          html += '<span class="cnt">' + rec.total_commits + "</span>";
          const w = Math.min(100, 12 + Math.sqrt(rec.total_commits) * 6.2);
          html += '<span class="bar" style="width:' + w + '%"></span>';
        }
      }
      cell.innerHTML = html;
      grid.appendChild(cell);
      if (rec) cellOf.set(ds, cell);
    }
    block.appendChild(grid);
    cal.appendChild(block);
  });

  // 线索（默认不画，选中或悬停某条链时画）
  const svg = document.getElementById("threads");
  function center(date) {
    const c = cellOf.get(date);
    if (!c) return null;
    const a = c.getBoundingClientRect(), b = cal.getBoundingClientRect();
    return { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2 };
  }
  function drawThread(id) {
    svg.style.height = cal.scrollHeight + "px";
    if (!id) { svg.innerHTML = ""; return; }
    const pts = (active.get(id) || []).map(center).filter(Boolean);
    const seg = [];
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], q = pts[i];
      const sameRow = Math.abs(p.y - q.y) < 4;
      seg.push(sameRow
        ? '<line x1="' + p.x + '" y1="' + p.y + '" x2="' + q.x + '" y2="' + q.y + '" stroke="var(--focus)" stroke-width="2"/>'
        : '<path d="M' + p.x + "," + p.y + " C" + (p.x + 60) + "," + p.y + " " + (q.x - 60) + "," + q.y + " "
          + q.x + "," + q.y + '" fill="none" stroke="var(--focus)" stroke-width="1.6" stroke-dasharray="5 4"/>');
    }
    pts.forEach((p) => seg.push('<circle cx="' + p.x + '" cy="' + p.y + '" r="3.5" fill="var(--focus)"/>'));
    // 交接：画到相邻链首日
    D.handoffs.forEach((h) => {
      if (h.from !== id && h.to !== id) return;
      const other = h.from === id ? h.to : h.from;
      if (!active.has(other)) return;
      const p = center(h.from === id ? active.get(id).slice(-1)[0] : active.get(other).slice(-1)[0]);
      const q = center(h.from === id ? active.get(other)[0] : active.get(id)[0]);
      if (!p || !q) return;
      seg.push('<path d="M' + p.x + "," + p.y + " C" + (p.x) + "," + (p.y + 70) + " " + q.x + "," + (q.y - 70)
        + " " + q.x + "," + q.y + '" fill="none" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="2 3"/>'
        + '<title>' + h.type + "</title>");
    });
    svg.innerHTML = seg.join("");
  }

  // 筛选 / 高亮
  let filter = null, scrollOnFilter = false;
  function applyFilter() {
    const bar = document.getElementById("filterbar");
    document.querySelectorAll(".ovbar").forEach((b) => b.classList.toggle("is-on", b.dataset.chain === filter));
    document.querySelectorAll(".cell").forEach((c) => {
      c.classList.toggle("dim", !!filter && !(c.dataset.chains || "").split(" ").includes(filter));
    });
    if (filter) {
      const c = chains.get(filter), a = active.get(filter);
      bar.innerHTML = "正在看　<b>" + esc(c.label) + "</b>　" + a[0] + " → " + a.slice(-1)[0] + "，"
        + a.length + " 天<button id='clear'>看全部</button>";
      document.getElementById("clear").onclick = () => { filter = null; applyFilter(); drawThread(null); };
      drawThread(filter);
      const first = cellOf.get(a[0]);
      if (first && scrollOnFilter) first.scrollIntoView({ block: "center", behavior: "auto" });
    } else {
      bar.innerHTML = "92 天全部显示。点上方任一条链，只留那条链并把它的日子串起来。";
      drawThread(null);
    }
  }
  document.getElementById("ovgrid").addEventListener("click", (e) => {
    const b = e.target.closest(".ovbar");
    if (!b) return;
    filter = filter === b.dataset.chain ? null : b.dataset.chain;
    scrollOnFilter = true; applyFilter(); scrollOnFilter = false;
  });

  // 选中日
  let sel = null;
  cal.addEventListener("click", (e) => {
    const c = e.target.closest(".cell.work");
    if (!c) return;
    if (sel) sel.classList.remove("sel");
    sel = c; c.classList.add("sel");
    renderPanel(byDate.get(c.dataset.date));
  });
  cal.addEventListener("mouseover", (e) => {
    const c = e.target.closest(".cell.work");
    if (!c || filter) return;
    const ids = (c.dataset.chains || "").split(" ").filter(Boolean);
    drawThread(ids[0] || null);
  });

  function renderPanel(d) {
    const p = document.getElementById("panel");
    if (!d) {
      p.innerHTML = '<div class="hint">点左边任意一天，这里显示那天做了什么、接住了什么、交给了谁，以及支持这句话的提交、计划和产出。</div>';
      return;
    }
    const out = [];
    out.push('<div class="pd">' + d.date + '</div><div class="pw">' + d.weekday
      + (d.report ? "　·　有每日汇报" : "") + "　·　" + (d.total_commits || 0) + " 次提交</div>");
    out.push("<h4>做了什么</h4><ul>");
    const bl = d.plans.length ? d.plans.map((x) => esc(x.title))
      : Object.values(d.items).flat().slice(0, 3).map((i) => esc(i.subject));
    out.push((bl.length ? bl : ["（这天没有计划文件，只有提交）"]).map((b) => "<li>" + b + "</li>").join("") + "</ul>");

    const fl = [];
    D.handoffs.forEach((h) => {
      if (d.chains.includes(h.to) && (active.get(h.to) || [])[0] === d.date) {
        fl.push('<div><span class="arrow">←</span>承接 ' + esc(chains.get(h.from).label) + '<span class="kind">' + h.type + "</span></div>");
      }
      if (d.chains.includes(h.from) && (active.get(h.from) || []).slice(-1)[0] === d.date) {
        fl.push('<div><span class="arrow">→</span>交给 ' + esc(chains.get(h.to).label) + '<span class="kind">' + h.type + "</span></div>");
      }
    });
    d.chains.forEach((c) => {
      const a = active.get(c) || [], i = a.indexOf(d.date);
      if (i > 0) fl.push('<div><span class="arrow">↑</span>' + esc(chains.get(c).short) + " 上一天 " + a[i - 1] + "</div>");
      if (i >= 0 && i < a.length - 1) fl.push('<div><span class="arrow">↓</span>' + esc(chains.get(c).short) + " 下一天 " + a[i + 1] + "</div>");
    });
    out.push('<h4>脉络</h4><div class="flow">' + (fl.join("") || "<div>这天还没有确认的上下游。</div>") + "</div>");

    out.push("<h4>根据</h4>");
    Object.entries(d.items).forEach(([repo, items]) => {
      const n = d.commits[repo];
      out.push("<details><summary>提交 " + (REPO_SHORT[repo] || repo) + " " + n + " 次"
        + (n > items.length ? "（前 " + items.length + " 条）" : "") + "</summary>"
        + '<p class="pathline">触及：' + esc((d.paths[repo] || []).map((x) => x[0] + " " + x[1]).join("　")) + "</p><table>"
        + items.map((i) => '<tr><td class="sha">' + i.sha + "</td><td>" + esc(i.subject) + "</td></tr>").join("")
        + "</table></details>");
    });
    if (d.plans.length) {
      out.push("<details open><summary>计划 " + d.plans.length + " 个</summary>"
        + d.plans.map((x) => '<div class="plan">' + esc(x.file) + "</div>").join("") + "</details>");
    }
    if (d.report) {
      out.push("<details open><summary>每日汇报</summary><div><b>" + esc(d.report.title) + "</b><br>"
        + esc(d.report.summary) + "</div></details>");
    }
    p.innerHTML = out.join("");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  renderPanel(null);
  applyFilter();
  let tid;
  window.addEventListener("resize", () => { clearTimeout(tid); tid = setTimeout(() => drawThread(filter), 120); });
})();
</script>
</body>
</html>
