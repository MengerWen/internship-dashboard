</style></head><body data-mode="b"><header class="topbar"><a class="report-name" href="index.html">26.10.23　沪市原始委托还原</a><nav aria-label="设计方案"><a href="dir-a.html">A 分页图解</a><a href="dir-b.html" aria-current="page">B 流程工作台</a><a href="dir-c.html">C 案例实验室</a></nav><button type="button" class="plain" data-action="sources">技术与证据</button></header><main id="app"></main><dialog id="evidence-dialog" aria-labelledby="evidence-title"><div class="dialog-head"><h2 id="evidence-title">技术与证据</h2><button type="button" class="plain" data-action="close-dialog">关闭</button></div><div id="evidence-body"></div></dialog><noscript><main class="fallback"><h1>沪市原始委托还原</h1><p>公开输入与适配器真值回环已通过；沪市独立定参与正式因子生产待推进。</p><section><h2>这项工作补上哪一环</h2><p class="purpose">深市已有因子公式与计算链。沪市需要先把公开消息组织成同一种可解释的输入，才能谈独立定参和重算。</p><p>深市前序工作确定了订单规则、即时撤余、生命周期、前后态和因果顺序，并形成配对、行为评分、六类核尺度及结构定参能力。它们提供了移植的基准，也提供了可检验的深市真值。</p><p>沪市先发布成交、再发布余量的机制，会改变订单入口、数量和序号含义。若直接把 A 当作原始委托，初始主动成交会丢失，余量也可能重复计数。</p><div class="table-wrap"><table><thead><tr><th scope="col">承接内容</th><th scope="col">本项目怎样使用</th><th scope="col">不能直接继承什么</th></tr></thead><tbody><tr><td>深市订单规则</td><td>识别自动撤余、初始撮合段、终端闭合；为回环提供真值</td><td>沪市细分类型、保护价及发布规则仍须按本市场定义</td></tr><tr><td>深市因子计算逻辑</td><td>复用候选、匹配、核、根分量、族与归约</td><td>未公开的原始价格、类型和数量不能继续参与评分</td></tr><tr><td>深市定参与生产流程</td><td>复用“核尺度→结构/F40→冻结参数→因子”的依赖顺序</td><td>深市参数、样本分组和性能不能自动作为沪市已验收结果</td></tr></tbody></table></div><p class="factline">深市 328 列是特定生产投影；本项目 352 源列与 540 候选身份属于公开定义验收范围。列数不同对应范围不同，不表示相互替代。</p><p class="role"><b>这一步交给后续什么</b>交付可解释、可追溯的沪市公开输入与候选定义，使后续标定知道自己究竟在估计哪种行为。</p></section><section><h2>先划清能够还原的边界</h2><p class="purpose">公开盘口、公开订单事实、隐藏原始属性是三个问题。只有前两者可靠接通，因子才能摆脱对不可见真值的依赖。</p><div class="table-wrap"><table><thead><tr><th scope="col">可见形态</th><th scope="col">能够确定什么</th><th scope="col">仍不能普遍确定什么</th></tr></thead><tbody><tr><td>先 A，后续 T/C</td><td>挂出价格、数量、可见存续及后续变化</td><td>真实原始类型未必唯一</td></tr><tr><td>先 T，再余量 A</td><td>初始成交＋余量组成可见数量，恢复成交前逻辑入场</td><td>一些原始类型仍可能产生相同公开记录</td></tr><tr><td>只有 T</td><td>订单身份、方向、公开执行及首次作用；部分数量可由撮合证明</td><td>部分原限价、细分类型和未发布即时撤余</td></tr><tr><td>零成交、零挂出即自动撤销</td><td>公开行情可能没有任何记录</td><td>不能凭空建立不可见订单身份或数量</td></tr></tbody></table></div><div class="inline-demo"><div class="order-demo" id="inline-order"><h2>一笔订单，行情怎样发布</h2><p class="demo-caption">数量示意，用于解释发布语义。</p><div class="buttons" role="group" aria-label="选择订单形态"><button type="button" data-order="rest" aria-pressed="false">先挂单</button><button type="button" data-order="partial" aria-pressed="true">成交后挂余量</button><button type="button" data-order="pure" aria-pressed="false">纯成交</button></div><div class="order-readout" aria-live="polite"><div class="order-path"><div><b>T</b><span>先成交 600 股</span></div><div><b>A</b><span>再挂出余量 400 股</span></div></div><p class="order-answer">公开可见数量 Qv = 600 + 400 = 1,000 股</p><p class="order-boundary">逻辑入场应回到首笔成交之前；余量 A 不能再算作第二笔新委托。</p></div><p class="demo-caption">T 为成交，A 为公开挂单，C 为公开撤单。</p></div></div><p>例如同一组纯成交记录可能同时兼容两个原限价，或兼容不同的市价类型和保护价组合。信息不唯一时，增加程序复杂度不能把它变成唯一真值。</p><details><summary>研究模型线做过什么，为什么没有充当生产真值</summary><p>独立研究 v2 输出证明字段、价格/类型/数量可行集、条件分布和每单 20 个可复现情景。沪深各 11 日，前 8 日拟合、后 3 日时间留出，分市场估计。</p><p>三个深市留出日均未证明限价点估计优于简单 v1。2026-06-30 精确率为 82.7566%→82.5314%，MAE 为 2.8604→2.9208 tick。隐藏撤余排序 AUC 较高，但低概率区仍低估发生率，且正例少。</p><p>估计属性投入前向撮合，能够重现已观察成交，只能证明兼容性。多个隐藏订单都能解释同一成交时，不能据此认证原始属性。</p></details><p class="role"><b>这一步交给后续什么</b>把“证明”“估计”“未知”分开保存。当前公开因子路径采用可观察事实，不把研究模型的点估计输入为真实原始订单。</p></section><section><h2>公开定义怎样进入因子</h2><p class="purpose">把不可见的申报意愿改成可观察的动作定义，同时保留每一列的科学身份。</p><dl class="definition-list"><dt>Qv</dt><dd>初始公开成交量＋公开挂出余量；未发布即时撤余不计入。</dd><dt>t0</dt><dd>首次公开作用时间；不提升为未知原始到达时间的证明。</dd><dt>pA / pX</dt><dd>公开挂出价 / 初始主动执行支持的价格，相关分支取最深执行价。</dd><dt>主动与显示</dt><dd>发生初始主动成交与是否挂出余量分开记录，避免漏掉纯成交行为。</dd><dt>排队影响</dt><dd>即时成交逻辑入场 ahead=0；排队稀释只计算真正挂出的余量。</dd></dl><div class="table-wrap"><table><thead><tr><th scope="col">实现范围</th><th scope="col">当前含义</th></tr></thead><tbody><tr><td>352 个源列</td><td>164 个共享列＋188 个分别计算 px/act 的源列，共 540 个候选身份</td></tr><tr><td>px / act</td><td>纯成交追价分别侧重公开执行价格变化 / 实际主动性变化；保留双版本</td></tr><tr><td>57 成员 union A</td><td>L=5、P=10、C=13、R=29；逐订单形成族与 union 分数，再归约股票日</td></tr><tr><td>6 个代理成员</td><td>f14、f15、f16 priceprio、f32、f35、f51 保留独立含义，不进入 union A</td></tr><tr><td>停用边界</td><td>dm03/dm04 共四列不生成沪市候选；f91 有公开候选实现，原停用登记未自动解除</td></tr></tbody></table></div><details><summary>v3 → v4 → v5 的定义推进</summary><p>v3 建立公开替换、双响应、57 成员 union 与逐列身份。v4 修正纯成交撤退、把实际主动行为计入相应分支，并用入场前状态评价余量被动性。</p><p>v5 修正 priorityworse：先在共同候选上匹配，再对相应纯成交分量计零。若匹配前删掉纯成交候选，旧单可能改配到挂出新单，产生额外分数。</p><p>原始约 356 源列中四个 dm03/dm04 停用列不进入这次 352 列范围。540 是候选身份数量，不能称作 540 个正式上线因子。union 得分也不是已校准的算法交易概率。</p></details><p class="role"><b>这一步交给后续什么</b>后续定参针对明确的公开行为与候选资格；代理列和不同版本不会与原深市列混成同一结果身份。</p></section><section><h2>原生回放与输入已经接通</h2><p class="purpose">先证明公开盘口和订单事实，再把这些已认证容器交给共同引擎。</p><div class="steps"><div><b>原生沪市 v2</b><p>归并成交与余量、恢复逻辑订单；采用截止前同时间戳撮合闭合。</p></div><div><b>公开事实与四表</b><p>生成 events、lifecycle、event_prestate、poststate；复用认证盘口。</p></div><div><b>公共因子引擎</b><p>直接消费 FactorInput；正式分支不再绕行旧 sse_to_szse_tables。</p></div></div><div class="table-wrap"><table><thead><tr><th scope="col">原生认证层</th><th scope="col">已核实范围</th><th scope="col">需要保留的限制</th></tr></thead><tbody><tr><td>总体</td><td>13 日期、29,622 股票日、1.805 亿规范事件</td><td>不是全 601 日认证</td></tr><tr><td>逐订单</td><td>29,620 完整可比股票日 W5 不等 0；截止闭合 7,477 单</td><td>回放完成不证明源消息绝无缺失</td></tr><tr><td>盘口与时间</td><td>整秒唯一状态 268,421/268,723 帧一致</td><td>快照无亚秒时间，不能强行逐事件对齐</td></tr><tr><td>队列与开盘</td><td>两日队列 437,358 帧全等；实际竞价价量 29,135 例全等</td><td>队列只覆盖两日；虚拟帧仍有 6 个价格、23 个数量不等</td></tr></tbody></table></div><p>窗口内任一快照阶段码不等于 3，整个股票日排除。已知阶段 8 例子的现象与临时停牌相符，具体官方码义仍未完全核实。同刻相邻全额撤单按普通撤单处理，不凭时间巧合认定来源。</p><p class="role"><b>这一步交给后续什么</b>把市场语义集中在原生回放和公开适配层；后续六核、结构支持和评分消费同一套因果状态。</p></section><section><h2>验收分成三个问题来回答</h2><p class="purpose">公开定义与原深市定义可以有差异。适配器正确性则要求同一公开定义、同一时钟走两条路径得到同一结果。</p><div class="pairing"><div><h3>S：直接公开投影</h3><p>深市认证真值，经公开事实和替换层，得到沪市公开定义输入。</p></div><div><h3>H：模拟沪市发布</h3><p>同一深市数据变成沪市 A/T/C 发布形态，再经沪市原生回放与适配器。</p></div></div><div class="table-wrap"><table><thead><tr><th scope="col">比较</th><th scope="col">决定什么</th><th scope="col">截至 26.10.23 的结果</th></tr></thead><tbody><tr><td>深市原定义 vs 公开定义</td><td>定义和可观测性造成什么变化</td><td>历史 v5 全市场订单 union 相关约 0.9626 / 0.9618；不要求全部等于原定义</td></tr><tr><td>S vs H，真值时钟</td><td>适配器是否构错输入或输出</td><td>2,888 股四表除白名单外全等；px 1,016,576 值、act 10,560 值逐位不等 0</td></tr><tr><td>S vs H，Q_equity</td><td>可观察消息时钟会带来多少数值误差</td><td>全市场 px 272/352 列至少一股变化，误差分布单列，未判断可接受性</td></tr></tbody></table></div><p>000725 已先单独完整执行，px、act 各 352 列全等。五只指定深市股票在修正前后两轮，对 r2/v5 新参考各 352 列全部逐位一致。旧参考 472 个不等项全部位于排队余量决定的影响范围，范围外为 0。</p><details><summary>参照 S 清理了什么，为什么输出不变仍必须修</summary><div class="table-wrap"><table><thead><tr><th scope="col">问题</th><th scope="col">独立定义与根因</th><th scope="col">修正</th></tr></thead><tbody><tr><td>437 条残留自动撤单</td><td>Qv≤0 不入事实表，删除序号也随之丢失</td><td>完整删除元数据另行携带；events、前态、后态残留清零</td></tr><tr><td>金额基准标签</td><td>公开价格和 L 已替换，原类型 BBO 标签仍残留</td><td>三处订单动作按生产规则写 submit_price</td></tr><tr><td>price_level_qty_pre</td><td>S 换价后仍沿用原价位量</td><td>各路径从公开增量重算当前动作价的同侧挂量</td></tr><tr><td>后态 price_tick</td><td>S 可能留原价，H 某些成交腿为 0</td><td>双方从自己的公开成交取实际执行价</td></tr><tr><td>qty_ahead_pre</td><td>S 的即时入场仍为 NA</td><td>逻辑入场未挂出，ahead=0</td></tr></tbody></table></div><p>三个字段没有从另一条路径复制值。12 个独立盘口/成交样本核验通过；修正后两版本全市场对 v5 因子向量变化均为 0 列、0 股。早期“输入完全公开”的证明边界由本轮更新。</p></details><details><summary>哪些表示差异可以放行，证据是什么</summary><p>三列：received_ts、vendor_aggressor_side_raw、仅保序且跨表对应的 event_pos。七个精确 attrs 键：szse_replay_version、szse_replay_fix_a、szse_replay_fix_c、replay_options、order_event_semantics、original_submissions_established、legal_unrested_trade_legs。</p><p>静态清单共 368 个命中；10 只活跃度分层股票×10 项×px/act，共 200 次有效扰动、70,400 个输出值比较，全部逐位不变。</p><p>event_pos 确实参与排序和定位。这里证明允许的保序改号不影响固定 352 列评分，不能简写成“引擎从不读取”。科学 seq 和 C2 修正字段不在白名单。</p></details><p class="role"><b>这一步交给后续什么</b>以可复核的证据区分输入实现问题、行为定义差异和时钟近似，防止把三类变化混称为“还原误差”。</p></section><section><h2>Q_equity 的误差已经量化</h2><p class="purpose">公开时钟可以稳定重建，但不会恢复所有未知通道位置。数值变化要交给明确的误差标准判断。</p><p>当前 Q_equity 从整条通道 A 股三表的观测消息秩出发，补逻辑入场槽、合并余量 A 槽；不能逐股压缩成自己的时钟。κ 缩放关闭，早期映射到深市流速的旧时钟仅保留描述性对照。</p><p>试验固定公开盘口、价格、数量和墙钟，只替换科学序号。使用冻结 R19，未重新估计任何参数。</p><p class="formula">尺度误差 = |H − S| ÷ scale(S)</p><p class="caption">scale(S) 取全市场 IQR/1.349；为 0 时改用总体标准差，仍为 0 则单列。下图为每列 p99 的分档，不是每股相对自身值的误差。</p><div class="bins" role="img" aria-label="p99 截面尺度误差分档，74、70、159、43、0列，另有6个零尺度列"><div class="bin"><span>≤ 10⁻⁴</span><div class="track"><div class="fill" style="width:46.5409%"></div></div><span class="count">74</span></div><div class="bin"><span>10⁻⁴—10⁻³</span><div class="track"><div class="fill" style="width:44.0252%"></div></div><span class="count">70</span></div><div class="bin"><span>10⁻³—10⁻²</span><div class="track"><div class="fill" style="width:100.0000%"></div></div><span class="count">159</span></div><div class="bin"><span>10⁻²—10⁻¹</span><div class="track"><div class="fill" style="width:27.0440%"></div></div><span class="count">43</span></div><div class="bin"><span>> 10⁻¹</span><div class="track"><div class="fill" style="width:0.0000%"></div></div><span class="count">0</span></div></div><p>另有 6 个零尺度结构列，全部逐位不变，秩相关未定义。其余 346 列 Spearman 最小为 0.99993455，中位数 0.99999966。有限/缺失状态变化为 0。</p><p>最差 p99 是 f43 买侧 0.052425 个截面尺度，最大 0.170156。消息距离进入 θ_events 衰减、候选和最强响应选择，再传播到族、union 和用途。高秩相关不能替代误差接受标准。</p><details><summary>接近零的列为什么不能只除以 |S|</summary><p>旧口径仍保留 |H−S|/max(|S|,1e−12)。f131 买侧的旧口径最大为 4.6034，而最大截面尺度误差为 0.01624。maker/taker 归一化差值接近 0 时，逐股分母会放大比值。</p><p>两种统计衡量不同问题，均应披露。当前未以重新定参“吸收”误差，也不能预先保证统一缩放 θ 能消除非线性、候选选择和固定端点修正带来的变化。</p></details><p class="role"><b>这一步交给后续什么</b>为后续采用何种消息时钟、怎样设置独立参数提供实际误差数据。可接受与否仍为待决定事项。</p></section><section><h2>真实沪市跑通，生产条件待补齐</h2><p class="purpose">真实输入冒烟证明了整条流程能够运行。参数来自临时借用，因此结果仍属于非生产验收。</p><div class="table-wrap"><table><thead><tr><th scope="col">真实沪市 2026-06-30</th><th scope="col">成功</th><th scope="col">阶段排除</th><th scope="col">失败</th></tr></thead><tbody><tr><td>px，正式母集 2,310 股</td><td>2,296</td><td>14</td><td>0</td></tr><tr><td>act，分层样本 30 股</td><td>29</td><td>1</td><td>0</td></tr></tbody></table></div><p>冒烟暂借深市冻结 R19：普通沪股借 Main、科创板借 ChiNext，流动性用 global 回退。这只能检查流程，不能生成独立沪市参数的正式身份。</p><div class="twocol"><div><h3>已经交付</h3><ul><li>原生 v2、公开 v5 适配与特殊阶段规则。</li><li>真值时钟下完整四表和引擎对照。</li><li>Q_equity 逐列误差、哈希和有限证据。</li><li>独立 XSHG 点时点股票池参考。</li></ul></div><div><h3>仍待完成或核对</h3><ul><li>Q_equity 误差接受决定。</li><li>沪市独立六核、结构与 F40 标定。</li><li>旧报价证据与当前正式入口的绑定。</li><li>跨日准入、全期预算和存储空间。</li></ul></div></div><details><summary>速度、资源和发布状态分别说明什么</summary><p>原生前态＋重建在 P75 日由 103.01 降到 82.95 秒，最重日由 107.83 降到 90.57 秒。四日期、9,163 股票日保持输出/已知异常等价。这不是整库因子或全期标定耗时。</p><p>真实沪市冒烟批次为 456.83 秒，平均 15.96 核，峰值 46.04 GiB。最新多路径收尾全部 15 次 guard 有效墙钟合计 91.56 分钟；主阶段峰值 76.64 GiB，swap 为 0，交易冻结实际生效。</p><p>本轮交付代码与报告进入 main，提交、GitHub 推送、wenjie 快进同步和业务执行各自留有版本。主要业务验收为 f6592c06，补充归约为 8de2ca87，最终交付为 2a0dac94。完整向量只在内存归约，本地保留摘要证据。</p><p>收尾记录系统盘余量约 2.5 GiB，低于日常 3 GiB 要求，部分账户增量未归因。该值来自收尾收据，不表示本页重新测量了当前服务器空间。</p></details><p class="role"><b>这一步交给后续什么</b>工程正确性已为正式流程打底；后续必须带着独立参数和完整准入身份运行，不能把这次冒烟改名为生产。</p></section><section><h2>下一步怎样接到定参与重算</h2><p class="purpose">沿深市已经建立的数学依赖顺序推进，用沪市自身样本重新形成参数和历史因子。</p><ol class="handoff-list"><li><b>冻结公开定义与输入凭据</b><p>确认原生 v2、公开 v5、Q_equity、px/act 范围与排除规则，核对股票池、报价证据和完整 L2。已有 601 日股票池不代表所有 L2/特征都齐备。</p></li><li><b>沪市六核：先确定“多近算相近”</b><p>采集时间、消息间隔、数量、价格、BBO 和 marketability 距离，独立估计尺度与支持。分组方式以沪市另行冻结规格为准，不能直接复制深市分组和共同中心。</p></li><li><b>结构支持与 F40 分段：再确定“怎样配对和计分”</b><p>绑定新核后采集结构观测与紧凑事实，依次完成 episode、anchor、cost、match 和门槛归约。上游门限变化后不能冒用旧阶段缓存。</p></li><li><b>冻结可审计的沪市参数包</b><p>绑定样本日期、回放/公开定义、权重、分位数、回退、输入与参数文件哈希，检查正式消费者确实读取这份参数。</p></li><li><b>正式因子面板与独立效果研究</b><p>先代表股日和整日，再按准入范围扩展历史。输出带列、输入、参数和排除身份的因子面板。收益标签、IC 和模型评价属于后续独立步骤。</p></li></ol><details><summary>九组结构参数的职责与当前估计规则</summary><div class="table-wrap"><table><thead><tr><th scope="col">组</th><th scope="col">作用</th><th scope="col">规则</th></tr></thead><tbody><tr><td>f16_priority_scales</td><td>排队/价格优先尺度</td><td>合格正观测中位数/ln(2)</td></tr><tr><td>f31_bottleneck_threshold</td><td>链路径最低质量</td><td>正值 P75</td></tr><tr><td>f40_matching_gates</td><td>episode、anchor 与路径门</td><td>P99 / P99.9 / P50</td></tr><tr><td>lambda40</td><td>完整候选最大匹配质量</td><td>正值 P05</td></tr><tr><td>lambda42</td><td>同侧/对侧 BBO 响应</td><td>合并正值 P05</td></tr><tr><td>f85_depth_scale</td><td>因果双侧深度</td><td>正值加权中位数</td></tr><tr><td>lambda_RV</td><td>连续 32 秒价差归一能量</td><td>正值 P10</td></tr><tr><td>z12_depth_scales</td><td>买卖侧前五档深度</td><td>逐股与分组正值加权中位数</td></tr><tr><td>p03_depletion_scale</td><td>公开冲击后的耗尽/恢复</td><td>正值中位数</td></tr></tbody></table></div><p>F85、z12 不除以 ln(2)；早期方案中的说明已有修订。六核与 F16 的 median/ln(2) 保留。旧时钟、旧公开定义和旧来源绑定均不能原样移入下一轮。</p></details><p>运行继续限定 wenjie、16 核/100G、交易时段冻结。原始行留在公司服务器；恢复按科学身份和哈希判断，热暂存用后清理，长期保存必要参数、面板及有界审计。</p><p class="role"><b>这一步交给后续什么</b>本项目交付的是可信的公开计算入口。下一阶段交付的是独立沪市参数及正式因子历史面板，之后才评价因子的预测用途。</p></section><section><h2>进展时间与证据入口</h2><p class="purpose">按工作目的回看推进过程，历史结果保留当时版本；本页以最新收尾更新当前状态。</p><div class="history"><time>9 月底</time><div><b>先证明哪些信息能够唯一恢复</b><p>盘口和大量数量事实可还原，部分原始价格/类型/即时撤余不可识别。</p></div><time>10.14</time><div><b>完成独立研究 v2 的规则、模型和留出</b><p>概率与可行集保留，点估计未优于简单基线，未充当生产真值。</p></div><time>10.21</time><div><b>公开 v3 与替换层进入全市场验收</b><p>逐列定义、双响应和候选身份建立；早期速度停止由后续工作接续。</p></div><time>10.22</time><div><b>v4/v5、原生认证与性能推进</b><p>修正纯成交计分与配对机制，确定 v2 和特殊阶段规则。</p></div><time>10.23</time><div><b>真实冒烟与适配器收尾</b><p>全市场输入/引擎真值回环通过，Q_equity 误差已披露，正式定参待启动。</p></div></div><details><summary>打开主要原始报告</summary><ol class="source-list"><li><a href="https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-09/2026-09-29-sse-original-order-reconstruction-review.md" target="_blank" rel="noopener">原始属性的可识别边界</a></li><li><a href="https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-14-sse-original-order-v2-validation.md" target="_blank" rel="noopener">研究模型留出结果</a></li><li><a href="https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-21-sse-visible-v3-implementation.md" target="_blank" rel="noopener">公开因子定义与候选身份</a></li><li><a href="https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-22-sse-native-replay-certification-r3.md" target="_blank" rel="noopener">原生分层认证</a></li><li><a href="https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-22-sse-priorityworse-union-attribution.md" target="_blank" rel="noopener">公开 v5 和剩余语义归因</a></li><li><a href="https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-23-sse-adapter.md" target="_blank" rel="noopener">真实沪市冒烟</a></li><li><a href="https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-23-sse-adapter-closure.md" target="_blank" rel="noopener">最新 C1–C5 收尾</a></li><li><a href="https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-20-frozen-parameter-replay-compatibility.md" target="_blank" rel="noopener">参数来源与 F85/z12 修订</a></li></ol></details><p class="caption">本页为方案初稿。正式汇报名义日期固定为 26.10.23，覆盖此前项目推进。数字对应各自样本与版本，不把局部验收合并成综合完成率。</p></section></main></noscript><script type="application/json" id="report-data">{"source": {"position": {"title": "这项工作补上哪一环", "body": "<p class=\"purpose\">深市已有因子公式与计算链。沪市需要先把公开消息组织成同一种可解释的输入，才能谈独立定参和重算。<\/p><p>深市前序工作确定了订单规则、即时撤余、生命周期、前后态和因果顺序，并形成配对、行为评分、六类核尺度及结构定参能力。它们提供了移植的基准，也提供了可检验的深市真值。<\/p><p>沪市先发布成交、再发布余量的机制，会改变订单入口、数量和序号含义。若直接把 A 当作原始委托，初始主动成交会丢失，余量也可能重复计数。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">承接内容<\/th><th scope=\"col\">本项目怎样使用<\/th><th scope=\"col\">不能直接继承什么<\/th><\/tr><\/thead><tbody><tr><td>深市订单规则<\/td><td>识别自动撤余、初始撮合段、终端闭合；为回环提供真值<\/td><td>沪市细分类型、保护价及发布规则仍须按本市场定义<\/td><\/tr><tr><td>深市因子计算逻辑<\/td><td>复用候选、匹配、核、根分量、族与归约<\/td><td>未公开的原始价格、类型和数量不能继续参与评分<\/td><\/tr><tr><td>深市定参与生产流程<\/td><td>复用“核尺度→结构/F40→冻结参数→因子”的依赖顺序<\/td><td>深市参数、样本分组和性能不能自动作为沪市已验收结果<\/td><\/tr><\/tbody><\/table><\/div><p class=\"factline\">深市 328 列是特定生产投影；本项目 352 源列与 540 候选身份属于公开定义验收范围。列数不同对应范围不同，不表示相互替代。<\/p><p class=\"role\"><b>这一步交给后续什么<\/b>交付可解释、可追溯的沪市公开输入与候选定义，使后续标定知道自己究竟在估计哪种行为。<\/p>"}, "observable": {"title": "先划清能够还原的边界", "body": "<p class=\"purpose\">公开盘口、公开订单事实、隐藏原始属性是三个问题。只有前两者可靠接通，因子才能摆脱对不可见真值的依赖。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">可见形态<\/th><th scope=\"col\">能够确定什么<\/th><th scope=\"col\">仍不能普遍确定什么<\/th><\/tr><\/thead><tbody><tr><td>先 A，后续 T/C<\/td><td>挂出价格、数量、可见存续及后续变化<\/td><td>真实原始类型未必唯一<\/td><\/tr><tr><td>先 T，再余量 A<\/td><td>初始成交＋余量组成可见数量，恢复成交前逻辑入场<\/td><td>一些原始类型仍可能产生相同公开记录<\/td><\/tr><tr><td>只有 T<\/td><td>订单身份、方向、公开执行及首次作用；部分数量可由撮合证明<\/td><td>部分原限价、细分类型和未发布即时撤余<\/td><\/tr><tr><td>零成交、零挂出即自动撤销<\/td><td>公开行情可能没有任何记录<\/td><td>不能凭空建立不可见订单身份或数量<\/td><\/tr><\/tbody><\/table><\/div><div class=\"inline-demo\"><div class=\"order-demo\" id=\"inline-order\"><h2>一笔订单，行情怎样发布<\/h2><p class=\"demo-caption\">数量示意，用于解释发布语义。<\/p><div class=\"buttons\" role=\"group\" aria-label=\"选择订单形态\"><button type=\"button\" data-order=\"rest\" aria-pressed=\"false\">先挂单<\/button><button type=\"button\" data-order=\"partial\" aria-pressed=\"true\">成交后挂余量<\/button><button type=\"button\" data-order=\"pure\" aria-pressed=\"false\">纯成交<\/button><\/div><div class=\"order-readout\" aria-live=\"polite\"><div class=\"order-path\"><div><b>T<\/b><span>先成交 600 股<\/span><\/div><div><b>A<\/b><span>再挂出余量 400 股<\/span><\/div><\/div><p class=\"order-answer\">公开可见数量 Qv = 600 + 400 = 1,000 股<\/p><p class=\"order-boundary\">逻辑入场应回到首笔成交之前；余量 A 不能再算作第二笔新委托。<\/p><\/div><p class=\"demo-caption\">T 为成交，A 为公开挂单，C 为公开撤单。<\/p><\/div><\/div><p>例如同一组纯成交记录可能同时兼容两个原限价，或兼容不同的市价类型和保护价组合。信息不唯一时，增加程序复杂度不能把它变成唯一真值。<\/p><details><summary>研究模型线做过什么，为什么没有充当生产真值<\/summary><p>独立研究 v2 输出证明字段、价格/类型/数量可行集、条件分布和每单 20 个可复现情景。沪深各 11 日，前 8 日拟合、后 3 日时间留出，分市场估计。<\/p><p>三个深市留出日均未证明限价点估计优于简单 v1。2026-06-30 精确率为 82.7566%→82.5314%，MAE 为 2.8604→2.9208 tick。隐藏撤余排序 AUC 较高，但低概率区仍低估发生率，且正例少。<\/p><p>估计属性投入前向撮合，能够重现已观察成交，只能证明兼容性。多个隐藏订单都能解释同一成交时，不能据此认证原始属性。<\/p><\/details><p class=\"role\"><b>这一步交给后续什么<\/b>把“证明”“估计”“未知”分开保存。当前公开因子路径采用可观察事实，不把研究模型的点估计输入为真实原始订单。<\/p>"}, "definition": {"title": "公开定义怎样进入因子", "body": "<p class=\"purpose\">把不可见的申报意愿改成可观察的动作定义，同时保留每一列的科学身份。<\/p><dl class=\"definition-list\"><dt>Qv<\/dt><dd>初始公开成交量＋公开挂出余量；未发布即时撤余不计入。<\/dd><dt>t0<\/dt><dd>首次公开作用时间；不提升为未知原始到达时间的证明。<\/dd><dt>pA / pX<\/dt><dd>公开挂出价 / 初始主动执行支持的价格，相关分支取最深执行价。<\/dd><dt>主动与显示<\/dt><dd>发生初始主动成交与是否挂出余量分开记录，避免漏掉纯成交行为。<\/dd><dt>排队影响<\/dt><dd>即时成交逻辑入场 ahead=0；排队稀释只计算真正挂出的余量。<\/dd><\/dl><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">实现范围<\/th><th scope=\"col\">当前含义<\/th><\/tr><\/thead><tbody><tr><td>352 个源列<\/td><td>164 个共享列＋188 个分别计算 px/act 的源列，共 540 个候选身份<\/td><\/tr><tr><td>px / act<\/td><td>纯成交追价分别侧重公开执行价格变化 / 实际主动性变化；保留双版本<\/td><\/tr><tr><td>57 成员 union A<\/td><td>L=5、P=10、C=13、R=29；逐订单形成族与 union 分数，再归约股票日<\/td><\/tr><tr><td>6 个代理成员<\/td><td>f14、f15、f16 priceprio、f32、f35、f51 保留独立含义，不进入 union A<\/td><\/tr><tr><td>停用边界<\/td><td>dm03/dm04 共四列不生成沪市候选；f91 有公开候选实现，原停用登记未自动解除<\/td><\/tr><\/tbody><\/table><\/div><details><summary>v3 → v4 → v5 的定义推进<\/summary><p>v3 建立公开替换、双响应、57 成员 union 与逐列身份。v4 修正纯成交撤退、把实际主动行为计入相应分支，并用入场前状态评价余量被动性。<\/p><p>v5 修正 priorityworse：先在共同候选上匹配，再对相应纯成交分量计零。若匹配前删掉纯成交候选，旧单可能改配到挂出新单，产生额外分数。<\/p><p>原始约 356 源列中四个 dm03/dm04 停用列不进入这次 352 列范围。540 是候选身份数量，不能称作 540 个正式上线因子。union 得分也不是已校准的算法交易概率。<\/p><\/details><p class=\"role\"><b>这一步交给后续什么<\/b>后续定参针对明确的公开行为与候选资格；代理列和不同版本不会与原深市列混成同一结果身份。<\/p>"}, "replay": {"title": "原生回放与输入已经接通", "body": "<p class=\"purpose\">先证明公开盘口和订单事实，再把这些已认证容器交给共同引擎。<\/p><div class=\"steps\"><div><b>原生沪市 v2<\/b><p>归并成交与余量、恢复逻辑订单；采用截止前同时间戳撮合闭合。<\/p><\/div><div><b>公开事实与四表<\/b><p>生成 events、lifecycle、event_prestate、poststate；复用认证盘口。<\/p><\/div><div><b>公共因子引擎<\/b><p>直接消费 FactorInput；正式分支不再绕行旧 sse_to_szse_tables。<\/p><\/div><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">原生认证层<\/th><th scope=\"col\">已核实范围<\/th><th scope=\"col\">需要保留的限制<\/th><\/tr><\/thead><tbody><tr><td>总体<\/td><td>13 日期、29,622 股票日、1.805 亿规范事件<\/td><td>不是全 601 日认证<\/td><\/tr><tr><td>逐订单<\/td><td>29,620 完整可比股票日 W5 不等 0；截止闭合 7,477 单<\/td><td>回放完成不证明源消息绝无缺失<\/td><\/tr><tr><td>盘口与时间<\/td><td>整秒唯一状态 268,421/268,723 帧一致<\/td><td>快照无亚秒时间，不能强行逐事件对齐<\/td><\/tr><tr><td>队列与开盘<\/td><td>两日队列 437,358 帧全等；实际竞价价量 29,135 例全等<\/td><td>队列只覆盖两日；虚拟帧仍有 6 个价格、23 个数量不等<\/td><\/tr><\/tbody><\/table><\/div><p>窗口内任一快照阶段码不等于 3，整个股票日排除。已知阶段 8 例子的现象与临时停牌相符，具体官方码义仍未完全核实。同刻相邻全额撤单按普通撤单处理，不凭时间巧合认定来源。<\/p><p class=\"role\"><b>这一步交给后续什么<\/b>把市场语义集中在原生回放和公开适配层；后续六核、结构支持和评分消费同一套因果状态。<\/p>"}, "evidence": {"title": "验收分成三个问题来回答", "body": "<p class=\"purpose\">公开定义与原深市定义可以有差异。适配器正确性则要求同一公开定义、同一时钟走两条路径得到同一结果。<\/p><div class=\"pairing\"><div><h3>S：直接公开投影<\/h3><p>深市认证真值，经公开事实和替换层，得到沪市公开定义输入。<\/p><\/div><div><h3>H：模拟沪市发布<\/h3><p>同一深市数据变成沪市 A/T/C 发布形态，再经沪市原生回放与适配器。<\/p><\/div><\/div><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">比较<\/th><th scope=\"col\">决定什么<\/th><th scope=\"col\">截至 26.10.23 的结果<\/th><\/tr><\/thead><tbody><tr><td>深市原定义 vs 公开定义<\/td><td>定义和可观测性造成什么变化<\/td><td>历史 v5 全市场订单 union 相关约 0.9626 / 0.9618；不要求全部等于原定义<\/td><\/tr><tr><td>S vs H，真值时钟<\/td><td>适配器是否构错输入或输出<\/td><td>2,888 股四表除白名单外全等；px 1,016,576 值、act 10,560 值逐位不等 0<\/td><\/tr><tr><td>S vs H，Q_equity<\/td><td>可观察消息时钟会带来多少数值误差<\/td><td>全市场 px 272/352 列至少一股变化，误差分布单列，未判断可接受性<\/td><\/tr><\/tbody><\/table><\/div><p>000725 已先单独完整执行，px、act 各 352 列全等。五只指定深市股票在修正前后两轮，对 r2/v5 新参考各 352 列全部逐位一致。旧参考 472 个不等项全部位于排队余量决定的影响范围，范围外为 0。<\/p><details><summary>参照 S 清理了什么，为什么输出不变仍必须修<\/summary><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">问题<\/th><th scope=\"col\">独立定义与根因<\/th><th scope=\"col\">修正<\/th><\/tr><\/thead><tbody><tr><td>437 条残留自动撤单<\/td><td>Qv≤0 不入事实表，删除序号也随之丢失<\/td><td>完整删除元数据另行携带；events、前态、后态残留清零<\/td><\/tr><tr><td>金额基准标签<\/td><td>公开价格和 L 已替换，原类型 BBO 标签仍残留<\/td><td>三处订单动作按生产规则写 submit_price<\/td><\/tr><tr><td>price_level_qty_pre<\/td><td>S 换价后仍沿用原价位量<\/td><td>各路径从公开增量重算当前动作价的同侧挂量<\/td><\/tr><tr><td>后态 price_tick<\/td><td>S 可能留原价，H 某些成交腿为 0<\/td><td>双方从自己的公开成交取实际执行价<\/td><\/tr><tr><td>qty_ahead_pre<\/td><td>S 的即时入场仍为 NA<\/td><td>逻辑入场未挂出，ahead=0<\/td><\/tr><\/tbody><\/table><\/div><p>三个字段没有从另一条路径复制值。12 个独立盘口/成交样本核验通过；修正后两版本全市场对 v5 因子向量变化均为 0 列、0 股。早期“输入完全公开”的证明边界由本轮更新。<\/p><\/details><details><summary>哪些表示差异可以放行，证据是什么<\/summary><p>三列：received_ts、vendor_aggressor_side_raw、仅保序且跨表对应的 event_pos。七个精确 attrs 键：szse_replay_version、szse_replay_fix_a、szse_replay_fix_c、replay_options、order_event_semantics、original_submissions_established、legal_unrested_trade_legs。<\/p><p>静态清单共 368 个命中；10 只活跃度分层股票×10 项×px/act，共 200 次有效扰动、70,400 个输出值比较，全部逐位不变。<\/p><p>event_pos 确实参与排序和定位。这里证明允许的保序改号不影响固定 352 列评分，不能简写成“引擎从不读取”。科学 seq 和 C2 修正字段不在白名单。<\/p><\/details><p class=\"role\"><b>这一步交给后续什么<\/b>以可复核的证据区分输入实现问题、行为定义差异和时钟近似，防止把三类变化混称为“还原误差”。<\/p>"}, "clock": {"title": "Q_equity 的误差已经量化", "body": "<p class=\"purpose\">公开时钟可以稳定重建，但不会恢复所有未知通道位置。数值变化要交给明确的误差标准判断。<\/p><p>当前 Q_equity 从整条通道 A 股三表的观测消息秩出发，补逻辑入场槽、合并余量 A 槽；不能逐股压缩成自己的时钟。κ 缩放关闭，早期映射到深市流速的旧时钟仅保留描述性对照。<\/p><p>试验固定公开盘口、价格、数量和墙钟，只替换科学序号。使用冻结 R19，未重新估计任何参数。<\/p><p class=\"formula\">尺度误差 = |H − S| ÷ scale(S)<\/p><p class=\"caption\">scale(S) 取全市场 IQR/1.349；为 0 时改用总体标准差，仍为 0 则单列。下图为每列 p99 的分档，不是每股相对自身值的误差。<\/p><div class=\"bins\" role=\"img\" aria-label=\"p99 截面尺度误差分档，74、70、159、43、0列，另有6个零尺度列\"><div class=\"bin\"><span>≤ 10⁻⁴<\/span><div class=\"track\"><div class=\"fill\" style=\"width:46.5409%\"><\/div><\/div><span class=\"count\">74<\/span><\/div><div class=\"bin\"><span>10⁻⁴—10⁻³<\/span><div class=\"track\"><div class=\"fill\" style=\"width:44.0252%\"><\/div><\/div><span class=\"count\">70<\/span><\/div><div class=\"bin\"><span>10⁻³—10⁻²<\/span><div class=\"track\"><div class=\"fill\" style=\"width:100.0000%\"><\/div><\/div><span class=\"count\">159<\/span><\/div><div class=\"bin\"><span>10⁻²—10⁻¹<\/span><div class=\"track\"><div class=\"fill\" style=\"width:27.0440%\"><\/div><\/div><span class=\"count\">43<\/span><\/div><div class=\"bin\"><span>> 10⁻¹<\/span><div class=\"track\"><div class=\"fill\" style=\"width:0.0000%\"><\/div><\/div><span class=\"count\">0<\/span><\/div><\/div><p>另有 6 个零尺度结构列，全部逐位不变，秩相关未定义。其余 346 列 Spearman 最小为 0.99993455，中位数 0.99999966。有限/缺失状态变化为 0。<\/p><p>最差 p99 是 f43 买侧 0.052425 个截面尺度，最大 0.170156。消息距离进入 θ_events 衰减、候选和最强响应选择，再传播到族、union 和用途。高秩相关不能替代误差接受标准。<\/p><details><summary>接近零的列为什么不能只除以 |S|<\/summary><p>旧口径仍保留 |H−S|/max(|S|,1e−12)。f131 买侧的旧口径最大为 4.6034，而最大截面尺度误差为 0.01624。maker/taker 归一化差值接近 0 时，逐股分母会放大比值。<\/p><p>两种统计衡量不同问题，均应披露。当前未以重新定参“吸收”误差，也不能预先保证统一缩放 θ 能消除非线性、候选选择和固定端点修正带来的变化。<\/p><\/details><p class=\"role\"><b>这一步交给后续什么<\/b>为后续采用何种消息时钟、怎样设置独立参数提供实际误差数据。可接受与否仍为待决定事项。<\/p>"}, "status": {"title": "真实沪市跑通，生产条件待补齐", "body": "<p class=\"purpose\">真实输入冒烟证明了整条流程能够运行。参数来自临时借用，因此结果仍属于非生产验收。<\/p><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">真实沪市 2026-06-30<\/th><th scope=\"col\">成功<\/th><th scope=\"col\">阶段排除<\/th><th scope=\"col\">失败<\/th><\/tr><\/thead><tbody><tr><td>px，正式母集 2,310 股<\/td><td>2,296<\/td><td>14<\/td><td>0<\/td><\/tr><tr><td>act，分层样本 30 股<\/td><td>29<\/td><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><p>冒烟暂借深市冻结 R19：普通沪股借 Main、科创板借 ChiNext，流动性用 global 回退。这只能检查流程，不能生成独立沪市参数的正式身份。<\/p><div class=\"twocol\"><div><h3>已经交付<\/h3><ul><li>原生 v2、公开 v5 适配与特殊阶段规则。<\/li><li>真值时钟下完整四表和引擎对照。<\/li><li>Q_equity 逐列误差、哈希和有限证据。<\/li><li>独立 XSHG 点时点股票池参考。<\/li><\/ul><\/div><div><h3>仍待完成或核对<\/h3><ul><li>Q_equity 误差接受决定。<\/li><li>沪市独立六核、结构与 F40 标定。<\/li><li>旧报价证据与当前正式入口的绑定。<\/li><li>跨日准入、全期预算和存储空间。<\/li><\/ul><\/div><\/div><details><summary>速度、资源和发布状态分别说明什么<\/summary><p>原生前态＋重建在 P75 日由 103.01 降到 82.95 秒，最重日由 107.83 降到 90.57 秒。四日期、9,163 股票日保持输出/已知异常等价。这不是整库因子或全期标定耗时。<\/p><p>真实沪市冒烟批次为 456.83 秒，平均 15.96 核，峰值 46.04 GiB。最新多路径收尾全部 15 次 guard 有效墙钟合计 91.56 分钟；主阶段峰值 76.64 GiB，swap 为 0，交易冻结实际生效。<\/p><p>本轮交付代码与报告进入 main，提交、GitHub 推送、wenjie 快进同步和业务执行各自留有版本。主要业务验收为 f6592c06，补充归约为 8de2ca87，最终交付为 2a0dac94。完整向量只在内存归约，本地保留摘要证据。<\/p><p>收尾记录系统盘余量约 2.5 GiB，低于日常 3 GiB 要求，部分账户增量未归因。该值来自收尾收据，不表示本页重新测量了当前服务器空间。<\/p><\/details><p class=\"role\"><b>这一步交给后续什么<\/b>工程正确性已为正式流程打底；后续必须带着独立参数和完整准入身份运行，不能把这次冒烟改名为生产。<\/p>"}, "next": {"title": "下一步怎样接到定参与重算", "body": "<p class=\"purpose\">沿深市已经建立的数学依赖顺序推进，用沪市自身样本重新形成参数和历史因子。<\/p><ol class=\"handoff-list\"><li><b>冻结公开定义与输入凭据<\/b><p>确认原生 v2、公开 v5、Q_equity、px/act 范围与排除规则，核对股票池、报价证据和完整 L2。已有 601 日股票池不代表所有 L2/特征都齐备。<\/p><\/li><li><b>沪市六核：先确定“多近算相近”<\/b><p>采集时间、消息间隔、数量、价格、BBO 和 marketability 距离，独立估计尺度与支持。分组方式以沪市另行冻结规格为准，不能直接复制深市分组和共同中心。<\/p><\/li><li><b>结构支持与 F40 分段：再确定“怎样配对和计分”<\/b><p>绑定新核后采集结构观测与紧凑事实，依次完成 episode、anchor、cost、match 和门槛归约。上游门限变化后不能冒用旧阶段缓存。<\/p><\/li><li><b>冻结可审计的沪市参数包<\/b><p>绑定样本日期、回放/公开定义、权重、分位数、回退、输入与参数文件哈希，检查正式消费者确实读取这份参数。<\/p><\/li><li><b>正式因子面板与独立效果研究<\/b><p>先代表股日和整日，再按准入范围扩展历史。输出带列、输入、参数和排除身份的因子面板。收益标签、IC 和模型评价属于后续独立步骤。<\/p><\/li><\/ol><details><summary>九组结构参数的职责与当前估计规则<\/summary><div class=\"table-wrap\"><table><thead><tr><th scope=\"col\">组<\/th><th scope=\"col\">作用<\/th><th scope=\"col\">规则<\/th><\/tr><\/thead><tbody><tr><td>f16_priority_scales<\/td><td>排队/价格优先尺度<\/td><td>合格正观测中位数/ln(2)<\/td><\/tr><tr><td>f31_bottleneck_threshold<\/td><td>链路径最低质量<\/td><td>正值 P75<\/td><\/tr><tr><td>f40_matching_gates<\/td><td>episode、anchor 与路径门<\/td><td>P99 / P99.9 / P50<\/td><\/tr><tr><td>lambda40<\/td><td>完整候选最大匹配质量<\/td><td>正值 P05<\/td><\/tr><tr><td>lambda42<\/td><td>同侧/对侧 BBO 响应<\/td><td>合并正值 P05<\/td><\/tr><tr><td>f85_depth_scale<\/td><td>因果双侧深度<\/td><td>正值加权中位数<\/td><\/tr><tr><td>lambda_RV<\/td><td>连续 32 秒价差归一能量<\/td><td>正值 P10<\/td><\/tr><tr><td>z12_depth_scales<\/td><td>买卖侧前五档深度<\/td><td>逐股与分组正值加权中位数<\/td><\/tr><tr><td>p03_depletion_scale<\/td><td>公开冲击后的耗尽/恢复<\/td><td>正值中位数<\/td><\/tr><\/tbody><\/table><\/div><p>F85、z12 不除以 ln(2)；早期方案中的说明已有修订。六核与 F16 的 median/ln(2) 保留。旧时钟、旧公开定义和旧来源绑定均不能原样移入下一轮。<\/p><\/details><p>运行继续限定 wenjie、16 核/100G、交易时段冻结。原始行留在公司服务器；恢复按科学身份和哈希判断，热暂存用后清理，长期保存必要参数、面板及有界审计。<\/p><p class=\"role\"><b>这一步交给后续什么<\/b>本项目交付的是可信的公开计算入口。下一阶段交付的是独立沪市参数及正式因子历史面板，之后才评价因子的预测用途。<\/p>"}, "reference": {"title": "进展时间与证据入口", "body": "<p class=\"purpose\">按工作目的回看推进过程，历史结果保留当时版本；本页以最新收尾更新当前状态。<\/p><div class=\"history\"><time>9 月底<\/time><div><b>先证明哪些信息能够唯一恢复<\/b><p>盘口和大量数量事实可还原，部分原始价格/类型/即时撤余不可识别。<\/p><\/div><time>10.14<\/time><div><b>完成独立研究 v2 的规则、模型和留出<\/b><p>概率与可行集保留，点估计未优于简单基线，未充当生产真值。<\/p><\/div><time>10.21<\/time><div><b>公开 v3 与替换层进入全市场验收<\/b><p>逐列定义、双响应和候选身份建立；早期速度停止由后续工作接续。<\/p><\/div><time>10.22<\/time><div><b>v4/v5、原生认证与性能推进<\/b><p>修正纯成交计分与配对机制，确定 v2 和特殊阶段规则。<\/p><\/div><time>10.23<\/time><div><b>真实冒烟与适配器收尾<\/b><p>全市场输入/引擎真值回环通过，Q_equity 误差已披露，正式定参待启动。<\/p><\/div><\/div><details><summary>打开主要原始报告<\/summary><ol class=\"source-list\"><li><a href=\"https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-09/2026-09-29-sse-original-order-reconstruction-review.md\" target=\"_blank\" rel=\"noopener\">原始属性的可识别边界<\/a><\/li><li><a href=\"https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-14-sse-original-order-v2-validation.md\" target=\"_blank\" rel=\"noopener\">研究模型留出结果<\/a><\/li><li><a href=\"https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-21-sse-visible-v3-implementation.md\" target=\"_blank\" rel=\"noopener\">公开因子定义与候选身份<\/a><\/li><li><a href=\"https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-22-sse-native-replay-certification-r3.md\" target=\"_blank\" rel=\"noopener\">原生分层认证<\/a><\/li><li><a href=\"https://github.com/MengerWen/sirui-quant-research/blob/2a0dac94c750eed237207a6bc7d288a81d428130/reports/2026-10/2026-10-22-sse-priorityworse-union-attribution.md\" target=\"_blank\" rel=\"noopener\">公开 v5 和剩余语义归因<\/a><\/li><li><a href=\"https://github.com/MengerWen/sirui-quant-research/bl
