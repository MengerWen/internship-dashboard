  <script>
    (()=>{
      const root=document.getElementById('proof-solid');
      if(!root)return;
      const cases=[{"id":"sse-v2","label":"沪市委托还原","note":"沪深三项口径修正通过全市场对照","kind":"mixed","weight":74,"tags":["代码","提交","验收记录","会话"],"artifact":"三项口径修正与全市场对照","url":"https://github.com/MengerWen/sirui-quant-research/blob/fb52d08a98c5fdd4b576dae0489d951205a38dff/reports/2026-10/2026-10-21-open5m-queue-f16-dm-decisions-r2.md","discussion":"决定排队余量采用新口径，并用于后续耗尽尺度定参。"},{"id":"replay","label":"回放核验","note":"完整日验收并保留回放来源","kind":"artifact","weight":0,"tags":["文档"],"artifact":"正确盘口 344 列重新定参","url":"https://github.com/MengerWen/sirui-quant-research/blob/9d3e0a37ca0ecff805a0707b14d2b70f7cc18be6/reports/2026-10/2026-10-20-corrected-replay-344-recalibration.md","discussion":""},{"id":"research-journal","label":"研究日志","note":"修复采集并补核来源","kind":"artifact","weight":34,"tags":["代码","提交"],"artifact":"研究日志图谱与来源采集改动","url":"https://github.com/MengerWen/internship-dashboard/commit/902b03b440425600c64ac4ba0030eeab3a36d9e9","discussion":""},{"id":"behavior-design","label":"行为构思","note":"比较 V3 至 V9 的沪深适用性和顺序","kind":"discussion","weight":0,"tags":["会话"],"artifact":"","url":"","discussion":"比较不同方案在沪深市场的适用性；具体实现与验证仍需后续记录。"},{"id":"corrected-replay-344","label":"344 列定参","note":"六核采集推进，结构参数改用新口径","kind":"pending","weight":null,"tags":["待核"],"artifact":"","url":"","discussion":"需要补核文件、提交及运行回执之间的对应关系。"}];
      const detail=root.querySelector('.ps-detail');
      const buttons=Array.from(root.querySelectorAll('[data-case]'));
      const state={selected:'sse-v2'};
      const escape=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      function render(){
        const item=cases.find(entry=>entry.id===state.selected)||cases[0];
        buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.case===item.id)));
        const status=item.kind==='mixed'?'有产物 · 同时保留讨论':item.kind==='discussion'?'仅见交流':item.kind==='pending'?'证据待核':item.weight===0?'文档已落盘 · 0 提交':'代码与提交';

        if(item.artifact){content+=`<div class="ps-material-group"><div class="ps-group-title">产物<span>1 项材料</span></div><a class="ps-material-link" href="${escape(item.url)}" target="_blank" rel="noopener noreferrer"><span class="ps-link-title">${escape(item.artifact)} ↗</span><span class="ps-link-type">${escape(item.tags.filter(tag=>tag!=='会话').join(' · '))} · GitHub</span></a></div>`;}
        if(item.kind==='mixed'){content+=`<div class="ps-material-group"><div class="ps-group-title">讨论<span>会话摘录</span></div><dl class="ps-conversation"><dt>决定</dt><dd>${escape(item.discussion)}</dd><dt>待验证</dt><dd>后续耗尽尺度的定参结果。</dd></dl></div>`;}
        if(item.kind==='discussion'){content+=`<div class="ps-material-group"><div class="ps-group-title">产物<span>当前未见</span></div><p class="ps-empty">尚无对应文件或提交。</p></div><div class="ps-material-group"><div class="ps-group-title">讨论<span>会话摘录</span></div><dl class="ps-conversation"><dt>问题</dt><dd>V3 至 V9 在沪深市场的适用性和实现顺序。</dd><dt>讨论记录</dt><dd>${escape(item.discussion)}</dd><dt>待验证</dt><dd>具体实现及验证记录。</dd></dl></div>`;}
        if(item.kind==='pending'){content+=`<div class="ps-material-group"><div class="ps-group-title">待核材料</div><p>${escape(item.discussion)}</p><dl class="ps-conversation"><dt>当前缺口</dt><dd>文件、提交及运行回执的对应依据。</dd></dl></div>`;}
        detail.innerHTML=content;
      }
      buttons.forEach(button=>button.addEventListener('click',()=>{state.selected=button.dataset.case;render();}));
      const reportButton=root.querySelector('.ps-report-toggle');
      const reportPanel=root.querySelector('.ps-report-panel');
      reportButton.addEventListener('click',()=>{const open=reportButton.getAttribute('aria-expanded')==='true';reportButton.setAttribute('aria-expanded',String(!open));reportPanel.hidden=open;reportButton.textContent=open?'相关材料 3 ＋':'收起相关材料 −';});
      render();
