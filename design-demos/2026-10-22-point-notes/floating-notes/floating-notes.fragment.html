        if(!sd||!td||sd>td||td<'2026-09-01'||sd>'2026-10-21')return;
        const x1=positions.get(e.from),x2=positions.get(e.to),y1=y(sd),y2=y(td),bend=Math.max(22,Math.abs(y2-y1)/2);
        const dash={'派生':'4 3','依赖解除':'1 3','收口':'7 2 1 2'}[e.type]||(e.confidence==='inferred'?'2 5':'');
        p.push(`<path class="jf-handoff" stroke-dasharray="${dash}" d="M${x1},${y1}C${x1},${y1+bend} ${x2},${y2-bend} ${x2},${y2}"/>`);
      });
      data.chains.forEach(c=>{
        const ds=active.get(c.id),xx=positions.get(c.id);
        ds.forEach((d,i)=>{
          const yy=y(d.date),prev=ds[i-1];
          if(prev&&d.date>='2026-09-01'&&prev.date<='2026-10-21'){
            const drop=c.fate==='dropped'||[d,prev].some(v=>v.notes[c.id]?.outcome==='dropped');
            p.push(`<path class="jf-chain-line" stroke-dasharray="${drop?'1 3':number(d.date)-number(prev.date)>3?'2 4':''}" d="M${xx},${Math.max(0,y(prev.date))}V${yy}"/>`);
          }
          if(d.date<'2026-09-01')return;
          const r=radius(d,c.id),drop=d.notes[c.id]?.outcome==='dropped';
          pointCloud.push({x:xx,y:yy});
          if(drop)p.push(`<path class="jf-historic" fill="none" d="M${xx-r},${yy-r}l${r*2},${r*2}m0,${-r*2}l${-r*2},${r*2}"/>`);
          else p.push(`<circle class="jf-historic${d.report?' has-report':''}" data-original-point="${c.id}:${d.date}" cx="${xx}" cy="${yy}" r="${r}"/>`);
        });
        const last=ds.at(-1);
        if(last&&last.date>='2026-09-01'&&c.fate!=='dropped'&&(c.status==='done'||c.fate==='parked')&&c.end===last.date){
          const side=Math.sqrt(Math.PI)*radius(last,c.id);p.push(`<rect class="jf-historic${c.fate==='parked'?'':' has-report'}" x="${xx-side/2}" y="${y(last.date)-side/2}" width="${side}" height="${side}"/>`);
        }
      });
      p.push('<g class="jf-selection"></g>');plot.innerHTML=p.join('');
    }
    function buildNotes(){
      const focusedHeader=document.activeElement?.closest('.jf-float')?.dataset.chain;
      const day=selected();
      items=data.chains.filter(c=>day.chains.includes(c.id));if(!items.some(c=>c.id===focus))focus=items[0].id;
      q('select').value=date;q('.jf-context time').textContent=date;q('.jf-weekday').textContent=day.weekday;q('.jf-day-count').textContent=`${items.length} 项工作`;
      q('.jf-toggle').textContent=open?'收起说明':'展开说明';q('.jf-toggle').setAttribute('aria-pressed',String(open));
      q('.jf-arrange').disabled=!open;q('.jf-mobile-status').textContent=`${items.findIndex(c=>c.id===focus)+1} / ${items.length} · ${chainMap.get(focus).short}`;
      q('.jf-sr').textContent=`${date}，${chainMap.get(focus).short}，${day.notes[focus]?.note||''}`;
      all('.jf-head-chain').forEach(n=>{n.classList.toggle('is-current',items.some(c=>c.id===n.dataset.head));n.classList.toggle('is-focus',focus===n.dataset.head);});
      all('.jf-track').forEach(n=>n.classList.toggle('is-focus',n.dataset.track===chainMap.get(focus).track));
      all('[data-date-label]').forEach(n=>{n.style.fill=n.dataset.dateLabel===date?'var(--jf-ink)':'';n.style.fontWeight=n.dataset.dateLabel===date?'700':'';});
      const yy=y(date),sel=q('.jf-selection');
      sel.innerHTML=`<path class="jf-selected-rule" d="M0,${yy}H${width-10}"/>`;
      items.forEach(c=>{const x=positions.get(c.id),r=radius(day,c.id);sel.append(svg('circle',{class:'jf-now'+(day.report?' has-report':''),cx:x,cy:yy,r}));if(c.id===focus)sel.append(svg('circle',{class:'jf-ring',cx:x,cy:yy,r:r+4}));});
      const old=new Map(all('.jf-float').map(n=>[n.dataset.chain,{x:parseFloat(n.style.left),y:parseFloat(n.style.top),w:n.offsetWidth,h:n.offsetHeight}]));
      floats.innerHTML=items.map((c,i)=>{
        const v=day.weights[c.id],amount=v?.value??null,note=day.notes[c.id]?.note||'暂无说明';
        const extra=`${day.report?'有相关汇报':'未关联汇报'}${v?.shared?` · 含 ${v.shared} 条跨链提交的份额`:''}`;
        return `<article class="jf-float${focus===c.id?' is-focus':''}" data-chain="${c.id}" aria-label="${esc(c.short)}的工作说明"><button type="button" class="jf-float-head" aria-label="${esc(c.short)}，点击聚焦，拖动调整位置，方向键移动" aria-pressed="${focus===c.id}"><span class="jf-letter">${letter(i)}</span><strong>${esc(c.short)}</strong><span class="jf-grip" aria-hidden="true">⠿</span></button><p>${esc(note)}</p><div class="jf-float-footer"><span>归属提交量 <b>${amount===null?'待核':amount}</b></span><span>${date.slice(5)}</span></div><div class="jf-extra">${esc(extra)}${amount===0?'<br>无已归属提交；当天有工作记录。':''}</div></article>`;
      }).join('');
      floats.hidden=!open;
      q('.jf-point-buttons').innerHTML=items.map((c,i)=>`<button type="button" class="jf-point-button cursor-interaction" data-point="${c.id}" aria-label="${esc(c.short)}：${esc(day.notes[c.id]?.note)}" aria-pressed="${focus===c.id}" style="left:${positions.get(c.id)}px;top:${yy}px;width:${Math.max(16,Math.min(24,(width-125)/38))}px"><span class="jf-point-letter">${letter(i)}</span></button>`).join('');
      all('.jf-point-button').forEach(n=>n.onclick=()=>{focus=n.dataset.point;open=true;buildNotes();save();});
      placeNotes(old);
      all('.jf-float').forEach(node=>wireDrag(node));
      if(focusedHeader)all('.jf-float').find(n=>n.dataset.chain===focusedHeader)?.querySelector('button').focus({preventScroll:true});
    }
    function attachment(r,ax,ay){
      const cx=Math.max(r.x+16,Math.min(r.x+r.w-16,ax));
      if(ay>r.y+r.h)return{x:cx,y:r.y+r.h,edge:'bottom'};
      if(ay<r.y)return{x:cx,y:r.y,edge:'top'};
      return{x:ax<r.x?r.x:r.x+r.w,y:Math.max(r.y+15,Math.min(r.y+r.h-15,ay)),edge:ax<r.x?'left':'right'};
    }
    function overlap(a,b,pad=0){return a.x<b.x+b.w+pad&&a.x+a.w+pad>b.x&&a.y<b.y+b.h+pad&&a.y+a.h+pad>b.y;}
    function segmentHits(a,b,r,pad=7){
      pad=r.margin??pad;
      const l=r.x-pad,rt=r.x+r.w+pad,t=r.y-pad,bt=r.y+r.h+pad;
      if(Math.abs(a.x-b.x)<.1)return a.x>l+.1&&a.x<rt-.1&&Math.max(a.y,b.y)>t+.1&&Math.min(a.y,b.y)<bt-.1;
      if(Math.abs(a.y-b.y)<.1)return a.y>t+.1&&a.y<bt-.1&&Math.max(a.x,b.x)>l+.1&&Math.min(a.x,b.x)<rt-.1;
      return false;
    }
    function routedLine(start,end,obstacles,previous){
      const xs=[...new Set([start.x,end.x,Math.max(52,Math.min(start.x,end.x)-18),width-6,...obstacles.flatMap(r=>[r.x-(r.margin??8)-1,r.x+r.w+(r.margin??8)+1])])].filter(x=>x>=50&&x<=width-3).sort((a,b)=>a-b);
      const ys=[...new Set([start.y,end.y,...obstacles.flatMap(r=>[r.y-(r.margin??8)-1,r.y+r.h+(r.margin??8)+1])])].filter(v=>v>=3&&v<=height-3).sort((a,b)=>a-b);
      const nodes=[];const ids=new Map();
      ys.forEach((yy,yi)=>xs.forEach((xx,xi)=>{if(!obstacles.some(r=>xx>r.x-(r.margin??8)&&xx<r.x+r.w+(r.margin??8)&&yy>r.y-(r.margin??8)&&yy<r.y+r.h+(r.margin??8))){const id=nodes.length;nodes.push({x:xx,y:yy,xi,yi,edges:[]});ids.set(`${xi}:${yi}`,id);}}));
      nodes.forEach(n=>{
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const id=ids.get(`${n.xi+dx}:${n.yi+dy}`);if(id===undefined)return;const b=nodes[id];if(!obstacles.some(r=>segmentHits(n,b,r,8)))n.edges.push(id);});
      });
      const source=nodes.findIndex(n=>n.x===start.x&&n.y===start.y),goal=nodes.findIndex(n=>n.x===end.x&&n.y===end.y);
      if(source<0||goal<0)return[start,end];
      const dist=new Map(),prev=new Map(),queue=[{id:source,dir:0,cost:0,key:`${source}:0`}];dist.set(queue[0].key,0);let result=null;
      while(queue.length){
        queue.sort((a,b)=>a.cost-b.cost);const cur=queue.shift();if(cur.cost>dist.get(cur.key))continue;if(cur.id===goal){result=cur.key;break;}
        const a=nodes[cur.id];a.edges.forEach(id=>{
          const b=nodes[id],dir=Math.abs(a.x-b.x)<.1?1:2,key=`${id}:${dir}`;
          let crossing=0;
          previous.forEach(path=>{for(let i=1;i<path.length;i++){const c=path[i-1],d=path[i];if(dir===1&&Math.abs(c.y-d.y)<.1&&Math.min(c.x,d.x)<a.x&&Math.max(c.x,d.x)>a.x&&Math.min(a.y,b.y)<c.y&&Math.max(a.y,b.y)>c.y)crossing+=24;if(dir===2&&Math.abs(c.x-d.x)<.1&&Math.min(c.y,d.y)<a.y&&Math.max(c.y,d.y)>a.y&&Math.min(a.x,b.x)<c.x&&Math.max(a.x,b.x)>c.x)crossing+=24;}});
          const cost=cur.cost+Math.abs(a.x-b.x)+Math.abs(a.y-b.y)+(cur.dir&&cur.dir!==dir?18:0)+crossing;
          if(cost<(dist.get(key)??Infinity)){dist.set(key,cost);prev.set(key,cur.key);queue.push({id,dir,cost,key});}
        });
      }
      if(!result)return[start,end];
      const points=[];while(result){points.push(nodes[Number(result.split(':')[0])]);result=prev.get(result);}points.reverse();
      return points.filter((p,i)=>i===0||i===points.length-1||!(Math.abs(points[i-1].x-p.x)<.1&&Math.abs(p.x-points[i+1].x)<.1||Math.abs(points[i-1].y-p.y)<.1&&Math.abs(p.y-points[i+1].y)<.1));
    }
    function roundPath(points){
      if(points.length<2)return'';let d=`M${points[0].x},${points[0].y}`;
      for(let i=1;i<points.length-1;i++){
        const a=points[i-1],b=points[i],c=points[i+1],l1=Math.hypot(b.x-a.x,b.y-a.y),l2=Math.hypot(c.x-b.x,c.y-b.y),r=Math.min(6,l1/2,l2/2);
        const p={x:b.x+(a.x-b.x)*r/l1,y:b.y+(a.y-b.y)*r/l1},n={x:b.x+(c.x-b.x)*r/l2,y:b.y+(c.y-b.y)*r/l2};
        d+=` L${p.x},${p.y} Q${b.x},${b.y} ${n.x},${n.y}`;
      }
      return d+` L${points.at(-1).x},${points.at(-1).y}`;
    }
    function solve(rects){
      const occupied=[],ay=y(date),left=mobile?51:75;
      const sorted=[...rects].sort((a,b)=>positions.get(a.id)-positions.get(b.id));
      for(const r of sorted){
        const ax=positions.get(r.id),existing=manual.get(`${date}:${r.id}`);
        if(existing){r.x=Math.max(left,Math.min(width-r.w-5,existing.x));r.y=Math.max(12,Math.min(height-r.h-8,existing.y));occupied.push(r);continue;}
        const candidates=[];
        for(let lift=28;lift<=430;lift+=24){
          for(let side=-224;side<=224;side+=28){
            const x=Math.max(left,Math.min(width-r.w-5,ax-r.w*.45+side)),yy=ay-r.h-lift;
            if(yy<16)continue;
            candidates.push({x,y:yy,w:r.w,h:r.h});
          }
        }
        if(ay+28+r.h<height-5)for(let side=-168;side<=168;side+=28)candidates.push({x:Math.max(left,Math.min(width-r.w-5,ax-r.w*.45+side)),y:ay+29,w:r.w,h:r.h});
        let best=null,bestCost=Infinity;
        candidates.forEach(c=>{
          if(occupied.some(o=>overlap(c,o,14)))return;
          if(c.y<ay+23&&c.y+c.h>ay-23)return;
          const a=attachment(c,ax,ay),dist=Math.hypot(a.x-ax,a.y-ay);
          const behind=pointCloud.filter(p=>p.x>c.x-3&&p.x<c.x+c.w+3&&p.y>c.y-3&&p.y<c.y+c.h+3).length;
          let leaderBlocks=0;
          occupied.forEach(o=>{const oa=attachment(o,positions.get(o.id),ay);for(let t=.1;t<1;t+=.1){const xx=oa.x+(positions.get(o.id)-oa.x)*t,yy=oa.y+(ay-oa.y)*t;if(xx>c.x-5&&xx<c.x+c.w+5&&yy>c.y-5&&yy<c.y+c.h+5)leaderBlocks+=1;}});
          occupied.forEach(o=>{for(let t=.1;t<1;t+=.1){const xx=a.x+(ax-a.x)*t,yy=a.y+(ay-a.y)*t;if(xx>o.x-5&&xx<o.x+o.w+5&&yy>o.y-5&&yy<o.y+o.h+5)leaderBlocks+=1;}});
          const preferredLift=({'wangly-env':38,'research-code':106,'replay':152,'sse-v2':64,'corrected-replay-344':166,'research-journal':94})[r.id]??(38+[0,72,124,32,108,64][sorted.indexOf(r)%6]);
          const cost=dist*1.1+Math.abs(a.x-ax)*.6+behind*7+leaderBlocks*16+Math.abs((ay-c.y-c.h)-preferredLift)*1.6;
          if(cost<bestCost){best=c;bestCost=cost;}
        });
        if(!best)best={x:Math.max(left,Math.min(width-r.w-5,ax-r.w/2)),y:Math.max(12,ay-r.h-32-occupied.length*30)};
        r.x=best.x;r.y=best.y;occupied.push(r);
      }
      return sorted;
    }
    function placeNotes(old=new Map()){
      const nodes=all('.jf-float'),ay=y(date);layoutSerial++;
      const rects=nodes.map(n=>{
        const c=chainMap.get(n.dataset.chain),isFocus=c.id===focus;
        const base=({ 'wangly-env':186,'research-code':179,'replay':205,'sse-v2':193,'corrected-replay-344':199,'research-journal':181 })[c.id]||190;
        n.style.width=`${mobile?Math.min(width-65,266):base+(isFocus?20:0)}px`;
        n.hidden=mobile&&c.id!==focus;
        return{id:c.id,node:n,w:n.offsetWidth,h:n.offsetHeight};
      }).filter(r=>!r.node.hidden);
      const solved=mobile?rects.map(r=>({...r,x:Math.max(51,Math.min(width-r.w-5,positions.get(r.id)-r.w*.5)),y:Math.max(100,ay-r.h-60)})):solve(rects);
      for(const r of solved){
        const n=r.node,p=old.get(r.id),ax=positions.get(r.id);
        n.style.left=`${r.x}px`;n.style.top=`${r.y}px`;n.dataset.x=r.x;n.dataset.y=r.y;
        n.getAnimations().forEach(a=>a.cancel());
        if(open){
          const dx=p?p.x-r.x:ax-r.x-r.w/2,dy=p?p.y-r.y:ay-r.y-r.h*.7;
          animate(n,[{transform:`translate(${dx}px,${dy}px) scale(${p?1:.84})`,opacity:p?1:0},{transform:'translate(0,0) scale(1)',opacity:1}],{...duration,delay:p?0:items.findIndex(c=>c.id===r.id)*28});
        }
      }
      drawLeaders(solved,!old.size);root.dataset.layout=layoutSerial;
    }
    function drawLeaders(rects=null,intro=false){
      links.innerHTML='';links.hidden=!open;
      const ay=y(date),rs=rects||all('.jf-float').filter(n=>!n.hidden).map(n=>({id:n.dataset.chain,x:parseFloat(n.style.left),y:parseFloat(n.style.top),w:n.offsetWidth,h:n.offsetHeight}));
      const previous=[];
      rs.sort((a,b)=>(b.id===focus?1:0)-(a.id===focus?1:0));
      rs.forEach(r=>{
        const ax=positions.get(r.id),a=attachment(r,ax,ay),isFocus=r.id===focus;
        const rPoint=radius(selected(),r.id),direction=a.y<ay?-1:1,py=ay+direction*(rPoint+3);
        const port={x:a.x+(a.edge==='left'?-10:a.edge==='right'?10:0),y:a.y+(a.edge==='top'?-10:a.edge==='bottom'?10:0)};
        const otherPoints=items.filter(c=>c.id!==r.id).map(c=>{const rr=radius(selected(),c.id)+3;return{x:positions.get(c.id)-rr,y:ay-rr,w:rr*2,h:rr*2,margin:0};});
        const waypoints=routedLine({x:ax,y:py},port,[...rs,...otherPoints],previous);waypoints.push(a);previous.push(waypoints);
        const path=roundPath(waypoints);
        links.append(svg('path',{class:'jf-leader-back',d:path}));
        const line=svg('path',{class:'jf-leader'+(isFocus?' is-focus':''),d:path,'data-leader':r.id,'data-anchor-x':ax,'data-anchor-y':ay,'data-route-points':JSON.stringify(waypoints.map(p=>({x:p.x,y:p.y})))});links.append(line);
        links.append(svg('circle',{class:'jf-joint'+(isFocus?' is-focus':''),cx:a.x,cy:a.y,r:isFocus?2.7:2}));
        if(intro){const len=line.getTotalLength();animate(line,[{strokeDasharray:`${len} ${len}`,strokeDashoffset:len},{strokeDasharray:`${len} ${len}`,strokeDashoffset:0}],{...duration,duration:560,delay:items.findIndex(c=>c.id===r.id)*28});}
      });
      const foreground=links.querySelector('.jf-leader.is-focus');
      if(foreground){const back=foreground.previousElementSibling,joint=foreground.nextElementSibling;links.append(back,foreground,joint);}
    }
    function wireDrag(node){
      const head=node.querySelector('button');let drag=null;
      head.addEventListener('click',()=>{if(head.dataset.dragged==='yes'){head.dataset.dragged='';return;}if(focus!==node.dataset.chain){focus=node.dataset.chain;buildNotes();save();}});
      head.addEventListener('pointerdown',e=>{if(e.button!==0)return;head.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,left:parseFloat(node.style.left),top:parseFloat(node.style.top),moved:false};node.getAnimations().forEach(a=>a.cancel());});
      head.addEventListener('pointermove',e=>{
        if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)<4&&!drag.moved)return;
        drag.moved=true;node.classList.add('is-dragging');
        node.style.left=`${Math.max(mobile?51:75,Math.min(width-node.offsetWidth-5,drag.left+dx))}px`;
        node.style.top=`${Math.max(8,Math.min(height-node.offsetHeight-6,drag.top+dy))}px`;drawLeaders();
      });
      const end=()=>{if(!drag)return;if(drag.moved){manual.set(`${date}:${node.dataset.chain}`,{x:parseFloat(node.style.left),y:parseFloat(node.style.top)});head.dataset.dragged='yes';}drag=null;node.classList.remove('is-dragging');};
      head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
      head.addEventListener('dblclick',()=>{manual.delete(`${date}:${node.dataset.chain}`);placeNotes(new Map(all('.jf-float').map(n=>[n.dataset.chain,{x:parseFloat(n.style.left),y:parseFloat(n.style.top)}])));});
      head.addEventListener('keydown',e=>{
        const delta={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-12],ArrowDown:[0,12]}[e.key];if(!delta)return;e.preventDefault();
        const x=Math.max(mobile?51:75,Math.min(width-node.offsetWidth-5,parseFloat(node.style.left)+delta[0])),yy=Math.max(8,Math.min(height-node.offsetHeight-6,parseFloat(node.style.top)+delta[1]));
        node.style.left=x+'px';node.style.top=yy+'px';manual.set(`${date}:${node.dataset.chain}`,{x,y:yy});drawLeaders();
      });
    }
    q('select').onchange=e=>{date=e.target.value;manual.clear();drawGraph();buildNotes();save();};
    q('.jf-toggle').onclick=()=>{open=!open;if(open)floats.innerHTML='';buildNotes();save();};
    q('.jf-arrange').onclick=()=>{manual.clear();floats.innerHTML='';buildNotes();save();};
    const step=delta=>{const i=items.findIndex(c=>c.id===focus);focus=items[(i+delta+items.length)%items.length].id;open=true;buildNotes();save();};
    q('.jf-prev').onclick=()=>step(-1);q('.jf-next').onclick=()=>step(1);
    root.addEventListener('keydown',e=>{if(e.key==='Escape'){open=false;buildNotes();save();}});
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);drawGraph();buildNotes();}});
    let prevWidth=stage.clientWidth;new ResizeObserver(()=>{const w=stage.clientWidth;if(Math.abs(w-prevWidth)<1)return;prevWidth=w;manual.clear();drawGraph();buildNotes();}).observe(stage);
    drawGraph();buildNotes();
  })();
