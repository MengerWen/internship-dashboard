  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;jpf-root&#x27;);

    const stage=q(&#x27;.jf-stage&#x27;), plot=q(&#x27;.jf-plot&#x27;), links=q(&#x27;.jf-links&#x27;), floats=q(&#x27;.jf-floats&#x27;);
    const days=data.days.filter(d=&gt;d.date&gt;=&#x27;2026-09-01&#x27;), choices=days.filter(d=&gt;d.date&gt;=&#x27;2026-10-14&#x27;);

    const number=d=&gt;Date.parse(d+&#x27;T00:00:00Z&#x27;)/86400000, start=number(&#x27;2026-09-01&#x27;);
    const esc=s=&gt;String(s??&#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
    const NS=&#x27;http://www.w3.org/2000/svg&#x27;;
    let date=&#x27;2026-10-20&#x27;,focus=&#x27;replay&#x27;,open=true,items=[],positions=new Map(),pointCloud=[],width=0,height=0,mobile=false,layoutSerial=0;
    const manual=new Map(),motion=()=&gt;!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
    let store=window.openai?.widgetState;

    };
    restore(store);
    const save=()=&gt;{window.openai?.setWidgetState?.({modelContent:{design:&#x27;floating-chain-notes&#x27;,date,chain:focus,open},privateContent:null})?.catch(()=&gt;{});};
    const svg=(tag,attrs)=&gt;{const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=&gt;n.setAttribute(k,v));return n;};

    const y=d=&gt;18+(number(d)-start)*(mobile?10.9:12.4);
    const letter=i=&gt;String.fromCharCode(65+i);

    const duration={duration:460,easing:&#x27;cubic-bezier(.19,1,.22,1)&#x27;,fill:&#x27;both&#x27;};
    q(&#x27;select&#x27;).innerHTML=choices.map(d=&gt;`&lt;option value=&quot;${d.date}&quot;&gt;${d.date} ${d.weekday}&lt;/option&gt;`).join(&#x27;&#x27;);
    function geometry(){
      width=stage.clientWidth;height=stage.clientHeight;mobile=width&lt;620;
      const left=mobile?44:65,pad=12,gap=mobile?3:8,cw=(width-left-pad-gap*6)/data.chains.length;
      data.chains.forEach((c,i)=&gt;positions.set(c.id,left+(i+.5)*cw+data.tracks.findIndex(t=&gt;t.id===c.track)*gap));
      return {left,pad,gap,cw};
    }
    function drawGraph(){
      const {left,pad,gap,cw}=geometry(), bottom=y(&#x27;2026-10-21&#x27;);
      plot.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);links.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);
      const head=[&#x27;&lt;span class=&quot;jf-date-title&quot;&gt;工作日期&lt;/span&gt;&#x27;];
      data.tracks.forEach(t=&gt;{
        const cs=data.chains.filter(c=&gt;c.track===t.id),x=positions.get(cs[0].id)-cw/2, end=positions.get(cs.at(-1).id)+cw/2;
        head.push(`&lt;span class=&quot;jf-track&quot; data-track=&quot;${t.id}&quot; aria-label=&quot;${esc(t.label)}&quot; style=&quot;left:${x}px;width:${end-x}px&quot;&gt;${esc(!mobile&amp;&amp;t.id===&#x27;special&#x27;?&#x27;专题&#x27;:t.label)}&lt;/span&gt;`);
      });
      data.chains.forEach(c=&gt;head.push(`&lt;span class=&quot;jf-head-chain&quot; data-head=&quot;${c.id}&quot; style=&quot;left:${positions.get(c.id)}px&quot;&gt;${esc(c.short)}&lt;/span&gt;`));
      q(&#x27;.jf-head&#x27;).innerHTML=head.join(&#x27;&#x27;);
      const p=[];pointCloud=[];
      for(let n=start;n&lt;=number(&#x27;2026-10-21&#x27;);n++){
        const d=new Date(n*86400000).toISOString().slice(0,10), yy=y(d),dow=new Date(n*86400000).getUTCDay();
        const rest=(d&gt;=&#x27;2026-10-01&#x27;&amp;&amp;d&lt;=&#x27;2026-10-07&#x27;)||([0,6].includes(dow)&amp;&amp;![&#x27;2026-09-20&#x27;,&#x27;2026-10-10&#x27;].includes(d));
        if(rest)p.push(`&lt;rect class=&quot;jf-rest&quot; x=&quot;${left}&quot; y=&quot;${yy-5.9}&quot; width=&quot;${width-left-pad}&quot; height=&quot;11.8&quot;/&gt;`);
        if(d.endsWith(&#x27;-01&#x27;))p.push(`&lt;path class=&quot;jf-divider&quot; d=&quot;M0,${yy}H${width-pad}&quot;/&gt;&lt;text x=&quot;0&quot; y=&quot;${yy-5}&quot;&gt;${Number(d.slice(5,7))}月&lt;/text&gt;`);
      }
      data.tracks.slice(0,-1).forEach(t=&gt;{
        const c=data.chains.filter(c=&gt;c.track===t.id).at(-1), xx=positions.get(c.id)+cw/2+gap/2;
        p.push(`&lt;path class=&quot;jf-divider&quot; d=&quot;M${xx},0V${height}&quot;/&gt;`);
      });
      days.forEach(d=&gt;{
        const yy=y(d.date),show=!mobile||new Date(d.date+&#x27;T00:00:00Z&#x27;).getUTCDay()===1||d.date===date;
        if(show)p.push(`&lt;text data-date-label=&quot;${d.date}&quot; x=&quot;${left-9}&quot; y=&quot;${yy+3.5}&quot; text-anchor=&quot;end&quot;&gt;${d.date.slice(5)}&lt;/text&gt;`);
        if(d.published)p.push(`&lt;path class=&quot;jf-divider&quot; d=&quot;M${left-6},${yy}h5&quot;/&gt;`);

        const sd=e.source_date?from.find(d=&gt;d.date===e.source_date)?.date:from.filter(d=&gt;d.date&lt;=td).at(-1)?.date;
        if(!sd||!td||sd&gt;td||td&lt;&#x27;2026-09-01&#x27;||sd&gt;&#x27;2026-10-21&#x27;)return;
        const x1=positions.get(e.from),x2=positions.get(e.to),y1=y(sd),y2=y(td),bend=Math.max(22,Math.abs(y2-y1)/2);
        const dash={&#x27;派生&#x27;:&#x27;4 3&#x27;,&#x27;依赖解除&#x27;:&#x27;1 3&#x27;,&#x27;收口&#x27;:&#x27;7 2 1 2&#x27;}[e.type]||(e.confidence===&#x27;inferred&#x27;?&#x27;2 5&#x27;:&#x27;&#x27;);
        p.push(`&lt;path class=&quot;jf-handoff&quot; stroke-dasharray=&quot;${dash}&quot; d=&quot;M${x1},${y1}C${x1},${y1+bend} ${x2},${y2-bend} ${x2},${y2}&quot;/&gt;`);
      });
      data.chains.forEach(c=&gt;{
        const ds=active.get(c.id),xx=positions.get(c.id);
        ds.forEach((d,i)=&gt;{
          const yy=y(d.date),prev=ds[i-1];
          if(prev&amp;&amp;d.date&gt;=&#x27;2026-09-01&#x27;&amp;&amp;prev.date&lt;=&#x27;2026-10-21&#x27;){
            const drop=c.fate===&#x27;dropped&#x27;||[d,prev].some(v=&gt;v.notes[c.id]?.outcome===&#x27;dropped&#x27;);

          }
          if(d.date&lt;&#x27;2026-09-01&#x27;)return;
          const r=radius(d,c.id),drop=d.notes[c.id]?.outcome===&#x27;dropped&#x27;;

          if(drop)p.push(`&lt;path class=&quot;jf-historic&quot; fill=&quot;none&quot; d=&quot;M${xx-r},${yy-r}l${r*2},${r*2}m0,${-r*2}l${-r*2},${r*2}&quot;/&gt;`);

        }

      p.push(&#x27;&lt;g class=&quot;jf-selection&quot;&gt;&lt;/g&gt;&#x27;);plot.innerHTML=p.join(&#x27;&#x27;);
    }
    function buildNotes(){
      const focusedHeader=document.activeElement?.closest(&#x27;.jf-float&#x27;)?.dataset.chain;
      const day=selected();
      items=data.chains.filter(c=&gt;day.chains.includes(c.id));if(!items.some(c=&gt;c.id===focus))focus=items[0].id;
      q(&#x27;select&#x27;).value=date;q(&#x27;.jf-context time&#x27;).textContent=date;q(&#x27;.jf-weekday&#x27;).textContent=day.weekday;q(&#x27;.jf-day-count&#x27;).textContent=`${items.length} 项工作`;
      q(&#x27;.jf-toggle&#x27;).textContent=open?&#x27;收起说明&#x27;:&#x27;展开说明&#x27;;q(&#x27;.jf-toggle&#x27;).setAttribute(&#x27;aria-pressed&#x27;,String(open));

      q(&#x27;.jf-sr&#x27;).textContent=`${date}，${chainMap.get(focus).short}，${day.notes[focus]?.note||&#x27;&#x27;}`;
      all(&#x27;.jf-head-chain&#x27;).forEach(n=&gt;{n.classList.toggle(&#x27;is-current&#x27;,items.some(c=&gt;c.id===n.dataset.head));n.classList.toggle(&#x27;is-focus&#x27;,focus===n.dataset.head);});

          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
