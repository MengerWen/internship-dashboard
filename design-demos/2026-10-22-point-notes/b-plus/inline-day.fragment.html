  <script>
  (()=>{
    const root=document.getElementById('jpd-bplus');
    const data=JSON.parse(root.querySelector('#jpd-bplus-data').textContent);
    const state={date:'2026-10-20',focused:'replay',expanded:true,legacyFocus:'replay'};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const diameter=v=>3+2.25*Math.log2(1+Math.max(0,v));
    const getDay=date=>data.days.find(d=>d.date===date);
    const dayTasks=day=>data.chains.filter(c=>day.chains.includes(c.id)).map(c=>({...c,note:day.notes[c.id]?.note||'注解待补',weight:day.weights[c.id]?.value??0,shared:day.weights[c.id]?.shared??0}));
    const dot=(day,id)=>`<i class="bp-dot${day.report?' is-filled':''}" style="--bp-diameter:${diameter(day.weights[id]?.value??0)}px" aria-hidden="true"></i>`;
    const weight=t=>t.weight===0?'当天无已归属提交':`归属提交量 <b>${t.weight}</b> 份${t.shared?'<small>含 1 条跨链提交<span class="bp-nowrap">的份额</span></small>':''}`;
    const note=s=>esc(s).replace('v3 候选','<span class="bp-nowrap">v3 候选</span>');
    const trackName=id=>data.tracks.find(t=>t.id===id)?.label||'';
    const announce=s=>{root.querySelector('[data-live]').textContent=s;};
    function board(){
      const day=getDay(state.date),tasks=dayTasks(day),index=data.days.indexOf(day);
      if(!tasks.some(t=>t.id===state.focused))state.focused=tasks[0]?.id;
      const weekday=['周日','周一','周二','周三','周四','周五','周六'][new Date(state.date+'T00:00:00Z').getUTCDay()];
      root.querySelector('[data-day-heading]').textContent=state.date+' 的工作';
      root.querySelector('[data-day-meta]').textContent=`${weekday}　${tasks.length} 项工作　${day.report?'有关联汇报':'未关联汇报'}`;
      root.querySelector('[data-scope]').textContent=state.expanded?`当日相关任务（${tasks.length} 条）`:`全部任务（${data.chains.length} 条）`;
      root.querySelector('[data-day-step="-1"]').disabled=index===0;
      root.querySelector('[data-day-step="1"]').disabled=index===data.days.length-1;
      const toggle=root.querySelector('[data-collapse]');toggle.textContent=state.expanded?'收起并查看全图':'展开当天说明';toggle.setAttribute('aria-expanded',String(state.expanded));
      const focusClass=id=>state.focused===id?' is-focused':'';
      const header=`<div class="bp-grid bp-header"><div class="bp-date-head">工作日期</div>${tasks.map(t=>`<button type="button" class="bp-column-name${focusClass(t.id)}" data-task="${t.id}" aria-pressed="${state.focused===t.id}" aria-label="聚焦${esc(t.short)}"><small>${esc(trackName(t.track))}</small><strong>${esc(t.short)}</strong></button>`).join('')}</div>`;
      const rows=data.days.map(d=>{
        if(d.date===state.date)return `<div class="bp-grid bp-current-row"><div class="bp-current-date"><button type="button" class="bp-day-button" data-date="${d.date}" aria-current="date" aria-label="查看${d.date}的工作">${d.date.slice(5)}</button><small>已展开</small></div>${tasks.map(t=>`<article class="bp-work-cell${focusClass(t.id)}" data-column="${t.id}" aria-label="${esc(t.short)}的当天说明"><button type="button" class="bp-marker-button" data-task="${t.id}" aria-pressed="${state.focused===t.id}" aria-label="聚焦${esc(t.short)}，${esc(t.note)}">${dot(d,t.id)}</button><span class="bp-short-stem" aria-hidden="true"></span><p class="bp-note">${note(t.note)}</p><p class="bp-weight">${weight(t)}</p></article>`).join('')}</div>`;
        const rest=['2026-10-17','2026-10-18'].includes(d.date)?' bp-rest':'';
        return `<div class="bp-grid bp-history-row${rest}"><button type="button" class="bp-day-button" data-date="${d.date}" aria-label="查看${d.date}的工作">${d.date.slice(5)}</button>${tasks.map(t=>`<div class="bp-history-cell${focusClass(t.id)}" data-column="${t.id}" aria-label="${d.date}，${esc(t.short)}，${d.chains.includes(t.id)?'有工作记录':'没有登记这项工作'}">${d.chains.includes(t.id)?dot(d,t.id):''}</div>`).join('')}</div>`;
      }).join('');
      const container=root.querySelector('[data-board]');container.style.setProperty('--bp-columns',tasks.length);container.innerHTML=state.expanded?header+rows:'<div class="bp-overview" data-overview></div>';
      if(!state.expanded)overview();
      root.querySelector('[data-mobile-days]').innerHTML=data.days.map(d=>`<button type="button" data-date="${d.date}" aria-pressed="${d.date===state.date}" aria-label="查看${d.date}的工作">${d.date.slice(5)}</button>`).join('');
      const mobile=root.querySelector('[data-mobile-records]');mobile.classList.toggle('is-collapsed',!state.expanded);
      const mobileTasks=state.expanded?tasks:data.chains.map(c=>tasks.find(t=>t.id===c.id)||{...c,note:'当天没有登记这项工作',weight:0});
      mobile.innerHTML=mobileTasks.map(t=>`<article class="bp-mobile-task${focusClass(t.id)}" data-column="${t.id}" aria-label="${esc(t.short)}的当天说明"><button type="button" class="bp-mobile-title" data-task="${t.id}" ${day.chains.includes(t.id)?'':'disabled'} aria-pressed="${state.focused===t.id}">${day.chains.includes(t.id)?dot(day,t.id):'<span class="bp-absent" aria-hidden="true"></span>'}<span>${esc(t.short)}</span></button><p class="bp-note">${note(t.note)}</p><p class="bp-weight">${weight(t)}</p></article>`).join('');
    }
    function overview(){
      const el=root.querySelector('[data-overview]');if(!el)return;
      const w=el.getBoundingClientRect().width;if(w<40)return;
      const day=getDay(state.date),head=122,pitch=28,left=68,right=14,cw=(w-left-right)/data.chains.length,h=head+data.days.length*pitch+20;
      const x=id=>left+(data.chains.findIndex(c=>c.id===id)+.5)*cw;
      const y=date=>head+data.days.findIndex(d=>d.date===date)*pitch;
      let html=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="全部38条任务的日期概览"><title>全部任务概览</title><text x="8" y="24">工作日期</text>`;
      data.chains.forEach(c=>{html+=`<text x="${x(c.id)}" y="20" style="writing-mode:vertical-rl" font-weight="${day.chains.includes(c.id)?700:400}">${esc(c.short)}</text>`;});
      html+=`<path d="M${left},${y(day.date)}H${w-right}" stroke="var(--bp-focus)" stroke-width="1.2"/>`;
      data.days.forEach(d=>{html+=`<text x="${left-12}" y="${y(d.date)+4}" text-anchor="end" font-weight="${d.date===day.date?700:400}">${d.date.slice(5)}</text>`;d.chains.forEach(id=>{html+=`<circle cx="${x(id)}" cy="${y(d.date)}" r="${diameter(d.weights[id]?.value??0)/2}" fill="${d.report?'var(--bp-past)':'var(--bp-paper)'}" stroke="${d.date===day.date?'var(--bp-ink)':'var(--bp-past)'}" stroke-width="1.2"/>`;});});
      el.innerHTML=html+'</svg>';
    }
    function focusTask(id){
      state.focused=id;
      root.querySelectorAll('[data-board] [data-task],[data-mobile-records] [data-task]').forEach(e=>{e.classList.toggle('is-focused',e.dataset.task===id);e.setAttribute('aria-pressed',String(e.dataset.task===id));});
      root.querySelectorAll('[data-board] [data-column],[data-mobile-records] [data-column]').forEach(e=>e.classList.toggle('is-focused',e.dataset.column===id));
      const task=dayTasks(getDay(state.date)).find(t=>t.id===id);announce(`已聚焦${task.short}。${task.note}`);
    }
    const legacyDay=getDay('2026-10-20');
    const legacyTasks=dayTasks(legacyDay).map((t,i)=>({...t,code:String.fromCharCode(65+i)}));
    root.querySelector('[data-legacy-grid]').innerHTML=legacyTasks.map(t=>`<button type="button" class="bp-legacy-lane${t.id===state.legacyFocus?' is-focused':''}" data-legacy-task="${t.id}" aria-pressed="${t.id===state.legacyFocus}" aria-label="原B，${esc(t.short)}，${esc(t.note)}"><span class="bp-legacy-marker">${dot(legacyDay,t.id)}</span><span class="bp-legacy-name"><span class="bp-code">${t.code}</span>${esc(t.short)}</span><span class="bp-legacy-note">${esc(t.note)}</span><span class="bp-weight">${weight(t)}</span></button>`).join('');
    function legacyChart(){
      const el=root.querySelector('[data-legacy-chart]'),w=el.getBoundingClientRect().width;if(w<40)return;
      const visible=w<720?legacyTasks:data.chains,left=w<720?52:68,right=14,head=w<720?92:111,pitch=19,extra=30,h=head+data.days.length*pitch+39+extra,cw=(w-left-right)/visible.length;
      const x=id=>left+(visible.findIndex(c=>c.id===id)+.5)*cw;
      const y=date=>{const i=data.days.findIndex(d=>d.date===date);return head+i*pitch+(i>6?extra:0);};
      let svg=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="原B的历史图，十月二十日的六项工作用A至F标记"><title>原B的历史图</title><rect x="${x(state.legacyFocus)-cw/2}" y="25" width="${cw}" height="${h-36}" fill="var(--bp-tint)"/><text x="0" y="18">工作日期</text>`;
      if(w>=720)data.tracks.forEach(tr=>{const group=visible.filter(c=>c.track===tr.id);if(group.length)svg+=`<text x="${(x(group[0].id)+x(group.at(-1).id))/2}" y="18" text-anchor="middle">${esc(tr.label)}</text>`;});
      visible.forEach(c=>{svg+=`<text x="${x(c.id)}" y="${w<720?13:37}" style="writing-mode:vertical-rl" font-weight="${legacyTasks.some(t=>t.id===c.id)?700:400}">${esc(c.short)}</text><path d="M${x(c.id)},${head-8}V${h-12}" stroke="var(--bp-rule)" stroke-width=".6"/>`;});
      data.days.forEach(d=>{svg+=`<text x="${left-12}" y="${y(d.date)+4}" text-anchor="end" font-weight="${d.date===legacyDay.date?700:400}">${d.date.slice(5)}</text>`;d.chains.forEach(id=>{if(visible.some(c=>c.id===id))svg+=`<circle cx="${x(id)}" cy="${y(d.date)}" r="${diameter(d.weights[id]?.value??0)/2}" fill="${d.report?'var(--bp-past)':'var(--bp-paper)'}" stroke="${d.date===legacyDay.date?'var(--bp-ink)':'var(--bp-past)'}" stroke-width="1.2"/>`;});});
      svg+=`<path d="M${left},${y(legacyDay.date)}H${w-right}" stroke="var(--bp-focus)" stroke-width="1.2"/>`;
      legacyTasks.forEach(t=>{const cy=y(legacyDay.date),focused=t.id===state.legacyFocus;svg+=`<circle cx="${x(t.id)}" cy="${cy}" r="${diameter(t.weight)/2}" fill="var(--bp-paper)" stroke="var(--bp-ink)" stroke-width="1.5"/>${focused?`<circle cx="${x(t.id)}" cy="${cy}" r="${diameter(t.weight)/2+3.5}" fill="none" stroke="var(--bp-focus)" stroke-width="2"/>`:''}<rect x="${x(t.id)-10}" y="${cy+17}" width="20" height="20" fill="${focused?'var(--bp-ink)':'var(--bp-surface)'}" stroke="var(--bp-ink)"/><text x="${x(t.id)}" y="${cy+31}" text-anchor="middle" style="fill:${focused?'var(--bp-paper)':'var(--bp-ink)'}">${t.code}</text>`;});
      el.innerHTML=svg+'</svg>';
    }
    root.addEventListener('click',e=>{
      const date=e.target.closest('[data-date]');if(date){state.date=date.dataset.date;state.expanded=true;board();announce(`已展开${state.date}的${dayTasks(getDay(state.date)).length}项工作`);return;}
      const step=e.target.closest('[data-day-step]');if(step){const i=data.days.findIndex(d=>d.date===state.date),next=data.days[i+Number(step.dataset.dayStep)];if(next){state.date=next.date;state.expanded=true;board();announce(`已展开${state.date}的工作`);}return;}
      const collapse=e.target.closest('[data-collapse]');if(collapse){state.expanded=!state.expanded;board();announce(state.expanded?'已展开当天说明':'已收起当天说明');return;}
      const task=e.target.closest('[data-task]');if(task){focusTask(task.dataset.task);return;}
      const old=e.target.closest('[data-legacy-task]');if(old){state.legacyFocus=old.dataset.legacyTask;root.querySelectorAll('[data-legacy-task]').forEach(b=>{b.classList.toggle('is-focused',b===old);b.setAttribute('aria-pressed',String(b===old));});legacyChart();}
    });
    root.addEventListener('keydown',e=>{const b=e.target.closest('[data-task]');if(!b||!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const tasks=dayTasks(getDay(state.date)),i=tasks.findIndex(t=>t.id===state.focused),next=tasks[(i+(e.key==='ArrowRight'?1:-1)+tasks.length)%tasks.length];focusTask(next.id);const target=root.querySelector(`[data-board] .bp-column-name[data-task="${next.id}"]`);if(target&&target.getBoundingClientRect().width>0)target.focus();});
    board();
    new ResizeObserver(legacyChart).observe(root.querySelector('[data-legacy-chart]'));
    new ResizeObserver(overview).observe(root.querySelector('[data-board]'));
